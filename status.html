<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <h1>MsGX</h1>
    <div class="app-bar-actions">
        <button onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
    </div>
</header>

<div class="tabs">
    <button class="tab" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chats</button>
    <button class="tab active"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>Status</button>
    <button class="tab" onclick="window.location.href='calls.html'"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>Calls</button>
</div>

<main class="container">
    <div class="settings-item" onclick="openAddStatus()" style="cursor:pointer;">
        <div style="display:flex;align-items:center;gap:15px;">
            <div class="chat-avatar" style="width:60px;height:60px;background:linear-gradient(135deg,#8800ff,#00aaff);">
                <svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:#fff;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
            <div>
                <div style="color:#fff;font-size:16px;font-weight:600;">My Status</div>
                <div style="color:#8888bb;font-size:12px;margin-top:4px;">Tap to add status update</div>
            </div>
        </div>
    </div>

    <div class="section-title" style="margin-top:25px;">📸 Recent Updates</div>
    <div id="statusList"></div>
</main>

<div class="modal" id="addStatusModal">
    <div class="modal-content">
        <h2>Add Status</h2>
        <textarea id="statusText" placeholder="Type your status..." style="width:100%;padding:14px;background:rgba(0,0,0,0.5);border:1px solid rgba(136,0,255,0.3);border-radius:10px;color:#fff;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;min-height:100px;resize:vertical;"></textarea>
        <p style="color:#8888bb;font-size:12px;margin-bottom:8px;">Background Color:</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;" id="colorPicker">
            <div onclick="selectColor('#8800ff', this)" style="width:36px;height:36px;border-radius:50%;background:#8800ff;cursor:pointer;border:2px solid rgba(255,255,255,0.2);"></div>
            <div onclick="selectColor('#00aaff', this)" style="width:36px;height:36px;border-radius:50%;background:#00aaff;cursor:pointer;border:2px solid rgba(255,255,255,0.2);"></div>
            <div onclick="selectColor('#ff0080', this)" style="width:36px;height:36px;border-radius:50%;background:#ff0080;cursor:pointer;border:2px solid rgba(255,255,255,0.2);"></div>
            <div onclick="selectColor('#00ff88', this)" style="width:36px;height:36px;border-radius:50%;background:#00ff88;cursor:pointer;border:2px solid rgba(255,255,255,0.2);"></div>
            <div onclick="selectColor('#ff6600', this)" style="width:36px;height:36px;border-radius:50%;background:#ff6600;cursor:pointer;border:2px solid rgba(255,255,255,0.2);"></div>
            <div onclick="selectColor('#1a0033', this)" style="width:36px;height:36px;border-radius:50%;background:#1a0033;cursor:pointer;border:2px solid rgba(255,255,255,0.2);"></div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
            <input type="file" id="statusImage" accept="image/*" style="display:none;">
            <input type="file" id="statusVideo" accept="video/*" style="display:none;">
            <button onclick="document.getElementById('statusImage').click()" style="flex:1;padding:12px;background:rgba(136,0,255,0.1);color:#8800ff;border:1px solid #8800ff;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:12px;">Image</button>
            <button onclick="document.getElementById('statusVideo').click()" style="flex:1;padding:12px;background:rgba(136,0,255,0.1);color:#8800ff;border:1px solid #8800ff;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:12px;">Video</button>
        </div>
        <p id="selectedImageName" style="color:#8800ff;font-size:11px;text-align:center;margin-bottom:10px;"></p>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeStatusModal()">Cancel</button>
            <button class="btn-save" onclick="saveStatus()">Post Status</button>
        </div>
    </div>
</div>

<div class="modal" id="viewStatusModal">
    <div class="modal-content" id="viewStatusContent"></div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
let selectedColor = '#8800ff';
let selectedImage = null;
let selectedVideo = null;

document.addEventListener('DOMContentLoaded', () => {
    loadGlobalWallpaper();
    renderBottomNav();
    ChatsStorage.cleanExpiredStatuses();
    renderStatuses();

    document.getElementById('statusImage').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        selectedVideo = null;
        const reader = new FileReader();
        reader.onload = (ev) => { selectedImage = ev.target.result; document.getElementById('selectedImageName').textContent = '🖼️ ' + file.name; };
        reader.readAsDataURL(file);
    });
    document.getElementById('statusVideo').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        selectedImage = null;
        const reader = new FileReader();
        reader.onload = (ev) => { selectedVideo = ev.target.result; document.getElementById('selectedImageName').textContent = '🎥 ' + file.name; };
        reader.readAsDataURL(file);
    });
});

function openAddStatus() { document.getElementById('addStatusModal').classList.add('show'); document.getElementById('statusText').value = ''; document.getElementById('selectedImageName').textContent = ''; selectedImage = null; selectedVideo = null; selectedColor = '#8800ff'; }
function closeStatusModal() { document.getElementById('addStatusModal').classList.remove('show'); }
function selectColor(color, el) { selectedColor = color; document.querySelectorAll('#colorPicker div').forEach(d => { d.style.border = '2px solid rgba(255,255,255,0.2)'; d.style.transform = 'scale(1)'; }); el.style.border = '3px solid #fff'; el.style.transform = 'scale(1.1)'; }
function saveStatus() {
    const text = document.getElementById('statusText').value.trim();
    if (!text && !selectedImage && !selectedVideo) { alert('Please enter text, image, or video'); return; }
    if (selectedImage) ChatsStorage.addStatus('image', selectedImage, selectedColor);
    else if (selectedVideo) ChatsStorage.addStatus('video', selectedVideo, selectedColor);
    else ChatsStorage.addStatus('text', text, selectedColor);
    closeStatusModal(); renderStatuses(); alert('Status posted!');
}
function renderStatuses() {
    const list = document.getElementById('statusList');
    const statuses = ChatsStorage.getActiveStatuses();
    if (statuses.length === 0) { list.innerHTML = `<div class="empty"><p>No status updates</p></div>`; return; }
    list.innerHTML = statuses.map(s => {
        const hoursLeft = Math.max(1, Math.round((new Date(s.expiresAt) - new Date()) / (1000 * 60 * 60)));
        if (s.type === 'video') return `<div class="settings-item" style="padding:10px;"><div style="display:flex;align-items:center;gap:12px;"><video src="${s.content}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;border:2px solid #8800ff;"></video><div style="flex:1;"><div style="color:#fff;font-size:13px;font-weight:600;">Video Status</div><div style="color:#8888bb;font-size:11px;margin-top:4px;">${hoursLeft}h remaining</div></div><button onclick="deleteStatus(${s.id})" style="background:transparent;color:#ff3366;border:1px solid #ff3366;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;">Delete</button></div></div>`;
        else if (s.type === 'image') return `<div class="settings-item" style="padding:10px;"><div style="display:flex;align-items:center;gap:12px;"><img src="${s.content}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;border:2px solid #8800ff;cursor:pointer;" onclick="viewStatus(${s.id})"><div style="flex:1;"><div style="color:#fff;font-size:13px;font-weight:600;">Image Status</div><div style="color:#8888bb;font-size:11px;margin-top:4px;">${hoursLeft}h remaining</div></div><button onclick="deleteStatus(${s.id})" style="background:transparent;color:#ff3366;border:1px solid #ff3366;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;">Delete</button></div></div>`;
        else return `<div class="settings-item" style="background:${s.bgColor};cursor:pointer;" onclick="viewStatus(${s.id})"><div style="color:#fff;font-size:14px;line-height:1.5;margin-bottom:8px;">${s.content}</div><div style="display:flex;justify-content:space-between;align-items:center;"><span style="color:rgba(255,255,255,0.7);font-size:11px;">${hoursLeft}h remaining</span><button onclick="event.stopPropagation(); deleteStatus(${s.id})" style="background:transparent;color:#fff;border:1px solid #fff;padding:4px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;">Delete</button></div></div>`;
    }).join('');
}
function viewStatus(id) {
    const statuses = ChatsStorage.getActiveStatuses();
    const s = statuses.find(st => st.id === id);
    if (!s) return;
    const content = document.getElementById('viewStatusContent');
    if (s.type === 'video') content.innerHTML = `<video src="${s.content}" controls autoplay style="width:100%;border-radius:12px;margin-bottom:15px;"></video><button onclick="closeModal('viewStatusModal')" class="btn-save" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#8800ff,#00aaff);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;">Close</button>`;
    else if (s.type === 'image') content.innerHTML = `<img src="${s.content}" style="width:100%;border-radius:12px;margin-bottom:15px;"><button onclick="closeModal('viewStatusModal')" class="btn-save" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#8800ff,#00aaff);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;">Close</button>`;
    else content.innerHTML = `<div style="background:${s.bgColor};padding:40px 20px;border-radius:12px;margin-bottom:15px;"><div style="color:#fff;font-size:18px;line-height:1.6;text-align:center;">${s.content}</div></div><button onclick="closeModal('viewStatusModal')" class="btn-save" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#8800ff,#00aaff);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;">Close</button>`;
    document.getElementById('viewStatusModal').classList.add('show');
}
function deleteStatus(id) { if (confirm('Delete this status?')) { ChatsStorage.deleteStatus(id); renderStatuses(); alert('Status deleted'); } }
function closeModal(id) { const modal = document.getElementById(id); if (modal) modal.classList.remove('show'); }
</script>
</body>
</html>
