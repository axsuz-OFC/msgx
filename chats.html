<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <h1>MsGX</h1>
    <div class="app-bar-actions">
        <button onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
    </div>
</header>

<div class="tabs">
    <button class="tab active"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chats</button>
    <button class="tab" onclick="window.location.href='status.html'"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>Status</button>
    <button class="tab" onclick="window.location.href='calls.html'"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>Calls</button>
</div>

<main class="container">
    <div class="section-title">Chats</div>
    <div class="chat-list" id="chatList"></div>
</main>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadGlobalWallpaper();
    renderBottomNav();
    renderChatList();
});

function renderChatList() {
    const list = document.getElementById('chatList');
    const contacts = ChatsStorage.getContacts();
    if (contacts.length === 0) {
        list.innerHTML = `<div class="empty"><p>No chats yet</p></div>`;
        return;
    }
    list.innerHTML = contacts.map(c => {
        const lastMsg = ChatsStorage.getLastMessage(c.id) || 'Tap to start chatting...';
        const time = ChatsStorage.getLastTime(c.id) || '';
        return `
            <a href="chat.html?id=${c.id}" class="chat-item">
                <div class="chat-avatar" style="background:linear-gradient(135deg, #8800ff, #00aaff)">${c.name.charAt(0).toUpperCase()}</div>
                <div class="chat-body"><div class="chat-top"><span class="chat-name">${c.name}</span><span class="chat-time">${time}</span></div><div class="chat-bottom"><span class="chat-preview">${lastMsg.substring(0, 30)}</span></div></div>
            </a>
        `;
    }).join('');
}
</script>
</body>
</html>
