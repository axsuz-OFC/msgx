<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">
        <img src="images/logo.jpg" alt="MsGX" class="logo-img" onerror="this.style.display='none'">
        <span class="logo-text">𝐌𝐒𝐆𝐗</span>
    </a>
    <div class="nav-links">
        <a href="#" onclick="openAddContact();return false;">➕ 𝐀𝐝𝐝</a>
        <a href="settings.html">⚙️</a>
    </div>
</nav>

<main class="container">
    <div class="section-title"><h2>💬 𝐂𝐇𝐀𝐓𝐒</h2></div>
    <div class="chat-list" id="chatList"></div>
</main>

<div id="footer"></div>

<div class="music-bar" id="musicBar">
    <div class="music-line">
        <div class="music-title" id="musicTitle">🎵 𝐌𝐬𝐆𝐗 𝐌𝐮𝐬𝐢𝐜</div>
        <div class="music-progress"></div>
    </div>
    <button class="music-btn-play" id="musicPlayBtn">▶</button>
    <button class="music-btn-stop" id="musicStopBtn">■</button>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Add Contact Modal -->
<div class="topup-modal" id="addModal">
    <div class="topup-content">
        <div class="topup-icon">➕</div>
        <h2>𝐀𝐝𝐝 𝐂𝐨𝐧𝐭𝐚𝐜𝐭</h2>
        <input type="text" id="contactName" placeholder="Contact Name" style="width:100%;padding:14px;margin-bottom:12px;background:#000;border:1px solid #00ff88;border-radius:10px;color:#fff;font-family:'Courier New',monospace;font-size:14px;">
        <input type="text" id="contactPhone" placeholder="Phone Number" style="width:100%;padding:14px;margin-bottom:12px;background:#000;border:1px solid #00ff88;border-radius:10px;color:#fff;font-family:'Courier New',monospace;font-size:14px;">
        <button onclick="saveContact()">💾 𝐒𝐚𝐯𝐞</button>
        <button class="topup-skip" onclick="closeAddContact()">𝐂𝐚𝐧𝐜𝐞𝐥</button>
    </div>
</div>

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderChatList();
    
    // Check URL for add=true
    if (window.location.search.includes('add=true')) {
        setTimeout(() => openAddContact(), 500);
    }
});

function renderChatList() {
    const list = document.getElementById('chatList');
    const contacts = ChatsStorage.getContacts();
    
    if (contacts.length === 0) {
        list.innerHTML = `
            <div class="empty-state" style="text-align:center;padding:60px 20px;color:#666;">
                <div style="font-size:60px;margin-bottom:15px;opacity:0.5;">💬</div>
                <p>𝐍𝐨 𝐜𝐡𝐚𝐭𝐬 𝐲𝐞𝐭<br>
                <a href="#" onclick="openAddContact();return false;" style="color:#00ff88;">Add your first contact!</a></p>
            </div>
        `;
        return;
    }
    
    list.innerHTML = contacts.map(c => {
        const lastMsg = ChatsStorage.getLastMessage(c.id) || 'Tap to start chatting...';
        const time = ChatsStorage.getLastTime(c.id) || '';
        return `
            <a href="chat.html?id=${c.id}" class="chat-item">
                <div class="chat-avatar">${c.name.charAt(0).toUpperCase()}</div>
                <div class="chat-info">
                    <div class="chat-name">${c.name}</div>
                    <div class="chat-preview">${lastMsg.substring(0, 30)}</div>
                </div>
                <div class="chat-time">${time}</div>
            </a>
        `;
    }).join('');
}

function openAddContact() {
    document.getElementById('addModal').classList.add('show');
}

function closeAddContact() {
    document.getElementById('addModal').classList.remove('show');
}

function saveContact() {
    const name = document.getElementById('contactName').value.trim();
    const phone = document.getElementById('contactPhone').value.trim();
    
    if (!name) {
        alert('Please enter a name!');
        return;
    }
    
    const contact = ChatsStorage.addContact(name, phone);
    closeAddContact();
    renderChatList();
    alert('✅ Contact added!');
}
</script>

</body>
</html>
