<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="splash" id="splash">
    <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="#8800ff" width="90" height="90"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
    </div>
    <div class="splash-name">MsGX</div>
    <div class="splash-tagline">Feature Messaging</div>
    <div class="splash-loader"></div>
</div>

<div id="app" style="display:none;">
    <header class="app-bar">
        <h1>MsGX</h1>
        <div class="app-bar-actions">
            <button onclick="openSearch()" aria-label="Search">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button onclick="toggleMenu()" aria-label="Menu">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <div class="dropdown-menu" id="dropdownMenu">
        <a href="new-group.html" class="menu-link">
            <svg viewBox="0 0 24 24" class="menu-icon"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            New group
        </a>
        <a href="broadcast.html" class="menu-link">
            <svg viewBox="0 0 24 24" class="menu-icon"><path d="M4 18v-6h6v6H4zm16 0h-6v-6h6v6zM4 10V4h6v6H4zm16 0h-6V4h6v6z"/></svg>
            Broadcast lists
        </a>
        <a href="linked.html" class="menu-link">
            <svg viewBox="0 0 24 24" class="menu-icon"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z"/></svg>
            Linked devices
        </a>
        <a href="starred.html" class="menu-link">
            <svg viewBox="0 0 24 24" class="menu-icon"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            Starred
        </a>
        <button onclick="changeWallpaper()">
            <svg viewBox="0 0 24 24" class="menu-icon"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Change Wallpaper
        </button>
        <button onclick="markAllRead()">
            <svg viewBox="0 0 24 24" class="menu-icon"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>
            Read all
        </button>
        <a href="settings.html" class="menu-link">
            <svg viewBox="0 0 24 24" class="menu-icon"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Settings
        </a>
    </div>

    <div class="tabs">
        <button class="tab active">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            Chats
        </button>
        <button class="tab" onclick="window.location.href='status.html'">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            Status
        </button>
        <button class="tab" onclick="window.location.href='calls.html'">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            Calls
        </button>
    </div>

    <div class="chat-list" id="chatList"></div>

    <button class="fab" onclick="openAddContact()" aria-label="New Chat">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V9H9v2H7v2h2v2h2v-2h2v-2z"/></svg>
    </button>

    <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="modal" id="addModal">
    <div class="modal-content">
        <h2>New Contact</h2>
        <input type="text" id="contactName" placeholder="Name">
        <input type="text" id="contactPhone" placeholder="Phone (optional)">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeAddContact()">Cancel</button>
            <button class="btn-save" onclick="saveContact()">Save</button>
        </div>
    </div>
</div>

<input type="file" id="wallpaperInput" accept="image/*,video/*" style="display:none;">

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderChats();
    renderBottomNav();
    loadWallpaper();
}, 2000);

function loadWallpaper() {
    const wpType = localStorage.getItem('msgx_wallpaper_type');
    const wpData = localStorage.getItem('msgx_wallpaper');

    if (!wpData) return;

    const existing = document.querySelector('.chat-video-bg');
    if (existing) existing.remove();

    if (wpType === 'video') {
        const videoBg = document.createElement('video');
        videoBg.src = wpData;
        videoBg.autoplay = true;
        videoBg.loop = true;
        videoBg.muted = true;
        videoBg.playsInline = true;
        videoBg.className = 'chat-video-bg';
        document.body.insertBefore(videoBg, document.body.firstChild);
    } else {
        document.body.style.backgroundImage = `url(${wpData})`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
    }
}

document.getElementById('wallpaperInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith('video/');
    const reader = new FileReader();
    reader.onload = (ev) => {
        ChatsStorage.saveWallpaper(ev.target.result, isVideo ? 'video' : 'image');
        loadWallpaper();
        alert('Wallpaper updated!');
    };
    reader.readAsDataURL(file);
});

function changeWallpaper() {
    document.getElementById('wallpaperInput').click();
}

function renderChats() {
    const list = document.getElementById('chatList');
    const contacts = ChatsStorage.getContacts();

    if (contacts.length === 0) {
        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="#6666aa" width="70" height="70"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                </div>
                <p>No chats yet</p>
                <button onclick="openAddContact()">Start New Chat</button>
            </div>
        `;
        return;
    }

    list.innerHTML = contacts.map(c => {
        const msgs = ChatsStorage.getMessages(c.id);
        const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
        const preview = lastMsg ? lastMsg.text : 'Tap to start chatting';
        const time = lastMsg ? lastMsg.time : '';
        const unread = msgs.filter(m => !m.sent && !m.read).length;
        const icon = c.isGroup ? 
            '<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff;"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>' 
            : c.name.charAt(0).toUpperCase();

        return `
            <a href="chat.html?id=${c.id}" class="chat-item" data-contact-id="${c.id}">
                <div class="chat-avatar" style="background:${getAvatarColor(c.name)}">
                    ${icon}
                </div>
                <div class="chat-body">
                    <div class="chat-top">
                        <span class="chat-name">${c.name} ${c.isGroup ? '<span style="color:#8800ff;font-size:10px;">(Group)</span>' : ''}</span>
                        <span class="chat-time">${time}</span>
                    </div>
                    <div class="chat-bottom">
                        <span class="chat-preview">${preview}</span>
                        ${unread > 0 ? `<span class="chat-badge">${unread}</span>` : ''}
                    </div>
                </div>
            </a>
        `;
    }).join('');

    document.querySelectorAll('.chat-item').forEach(el => {
        let timer;
        el.addEventListener('touchstart', () => {
            timer = setTimeout(() => openChatMenu(el.dataset.contactId), 600);
        });
        el.addEventListener('touchend', () => clearTimeout(timer));
        el.addEventListener('touchmove', () => clearTimeout(timer));
        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            openChatMenu(el.dataset.contactId);
        });
    });
}

function getAvatarColor(name) {
    const colors = [
        'linear-gradient(135deg, #8800ff, #00aaff)',
        'linear-gradient(135deg, #ff0080, #8800ff)',
        'linear-gradient(135deg, #00aaff, #00ff88)',
        'linear-gradient(135deg, #ff6600, #ff0080)',
        'linear-gradient(135deg, #9c27b0, #00aaff)'
    ];
    return colors[name.charCodeAt(0) % colors.length];
}

function openAddContact() { document.getElementById('addModal').classList.add('show'); }
function closeAddContact() { document.getElementById('addModal').classList.remove('show'); }

function saveContact() {
    const name = document.getElementById('contactName').value.trim();
    const phone = document.getElementById('contactPhone').value.trim();
    if (!name) { alert('Please enter a name'); return; }
    ChatsStorage.addContact(name, phone);
    closeAddContact();
    renderChats();
    document.getElementById('contactName').value = '';
    document.getElementById('contactPhone').value = '';
}

function openSearch() {
    window.location.href = 'search.html';
}

function toggleMenu() {
    document.getElementById('dropdownMenu').classList.toggle('show');
}

function markAllRead() {
    document.getElementById('dropdownMenu').classList.remove('show');
    const contacts = ChatsStorage.getContacts();
    contacts.forEach(c => {
        const msgs = ChatsStorage.getMessages(c.id);
        msgs.forEach(m => m.read = true);
        ChatsStorage.saveMessages(c.id, msgs);
    });
    renderChats();
    alert('All messages marked as read');
}

function openChatMenu(contactId) {
    const contact = ChatsStorage.getContact(contactId);
    if (!contact) return;

    const modal = document.createElement('div');
    modal.className = 'modal show';
    modal.id = 'chatMenuModal';
    modal.innerHTML = `
        <div class="modal-content">
            <h2>${contact.name}</h2>
            <p style="color:#8888bb;font-size:12px;margin-bottom:20px;text-align:center;">
                ${contact.isGroup ? 'Group Chat' : (contact.phone || 'No phone number')}
            </p>
            <div style="display:flex;flex-direction:column;gap:10px;">
                <button onclick="openChat(${contactId})" style="padding:14px;background:linear-gradient(135deg,#8800ff,#00aaff);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    Open Chat
                </button>
                <button onclick="markChatRead(${contactId})" style="padding:14px;background:rgba(136,0,255,0.1);color:#8800ff;border:1px solid #8800ff;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#8800ff;"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>
                    Mark as Read
                </button>
                <button onclick="clearChatMessages(${contactId})" style="padding:14px;background:rgba(255,170,0,0.1);color:#ffaa00;border:1px solid #ffaa00;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#ffaa00;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Clear Messages
                </button>
                <button onclick="deleteChat(${contactId})" style="padding:14px;background:rgba(255,50,100,0.1);color:#ff3366;border:1px solid #ff3366;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#ff3366;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Delete Contact
                </button>
                <button onclick="closeModal('chatMenuModal')" style="padding:14px;background:transparent;color:#8888bb;border:1px solid rgba(136,0,255,0.3);border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;">
                    Cancel
                </button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function openChat(contactId) { window.location.href = 'chat.html?id=' + contactId; }

function markChatRead(contactId) {
    const msgs = ChatsStorage.getMessages(contactId);
    msgs.forEach(m => m.read = true);
    ChatsStorage.saveMessages(contactId, msgs);
    closeModal('chatMenuModal');
    renderChats();
    alert('Chat marked as read');
}

function clearChatMessages(contactId) {
    if (confirm('Clear all messages in this chat?')) {
        ChatsStorage.clearMessages(contactId);
        closeModal('chatMenuModal');
        renderChats();
        alert('Messages cleared');
    }
}

function deleteChat(contactId) {
    if (confirm('Delete this contact and all messages?')) {
        ChatsStorage.deleteContact(contactId);
        closeModal('chatMenuModal');
        renderChats();
        alert('Contact deleted');
    }
}

function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('show');
    if (modal && modal.parentNode) modal.remove();
}

document.addEventListener('click', (e) => {
    const menu = document.getElementById('dropdownMenu');
    if (menu && !e.target.closest('.app-bar')) {
        menu.classList.remove('show');
    }
});
</script>

</body>
</html>
