<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8800ff">
<title>MsGX</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="splash" id="splash">
    <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="#8800ff" width="90" height="90"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
    </div>
    <div class="splash-name">MsGX</div>
    <div class="splash-tagline">Feature Messaging</div>
    <div class="splash-loader"></div>
</div>

<div id="app" style="display:none;">
    <header class="app-bar">
        <h1>MsGX</h1>
        <div class="app-bar-actions">
            <button onclick="window.location.href='search.html'">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button onclick="toggleMenu()">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <div class="dropdown-menu" id="dropdownMenu">
        <a href="new-group.html" class="menu-link"><svg viewBox="0 0 24 24" class="menu-icon"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>New group</a>
        <a href="broadcast.html" class="menu-link"><svg viewBox="0 0 24 24" class="menu-icon"><path d="M4 18v-6h6v6H4zm16 0h-6v-6h6v6zM4 10V4h6v6H4zm16 0h-6V4h6v6z"/></svg>Broadcast lists</a>
        <a href="linked.html" class="menu-link"><svg viewBox="0 0 24 24" class="menu-icon"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z"/></svg>Linked devices</a>
        <a href="starred.html" class="menu-link"><svg viewBox="0 0 24 24" class="menu-icon"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>Starred</a>
        <button onclick="changeWallpaper()"><svg viewBox="0 0 24 24" class="menu-icon"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>Change Wallpaper</button>
        <button onclick="markAllRead()"><svg viewBox="0 0 24 24" class="menu-icon"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>Read all</button>
        <a href="settings.html" class="menu-link"><svg viewBox="0 0 24 24" class="menu-icon"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Settings</a>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chats</button>
        <button class="tab" onclick="window.location.href='status.html'"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>Status</button>
        <button class="tab" onclick="window.location.href='calls.html'"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>Calls</button>
    </div>

    <div class="chat-list" id="chatList"></div>

    <button class="fab" onclick="openAddContact()"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V9H9v2H7v2h2v2h2v-2h2v-2z"/></svg></button>

    <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="modal" id="addModal">
    <div class="modal-content">
        <h2>New Contact</h2>
        <input type="text" id="contactName" placeholder="Name">
        <input type="text" id="contactPhone" placeholder="Phone (optional)">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeAddContact()">Cancel</button>
            <button class="btn-save" onclick="saveContact()">Save</button>
        </div>
    </div>
</div>

<input type="file" id="wallpaperInput" accept="image/*,video/*" style="display:none;">

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!ChatsStorage.isLoggedIn()) { window.location.href = 'login.html'; return; }
    applyTheme();
    loadGlobalWallpaper();
});

setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderChats();
    renderBottomNav();
}, 1500);

document.getElementById('wallpaperInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith('video/');
    const reader = new FileReader();
    reader.onload = (ev) => {
        ChatsStorage.saveWallpaper(ev.target.result, isVideo ? 'video' : 'image');
        loadGlobalWallpaper();
        alert('Wallpaper updated!');
    };
    reader.readAsDataURL(file);
});

function changeWallpaper() { document.getElementById('wallpaperInput').click(); }
function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('show'); }

function renderChats() {
    const list = document.getElementById('chatList');
    const contacts = ChatsStorage.getContacts();
    if (contacts.length === 0) {
        list.innerHTML = `<div class="empty"><p>No chats yet</p><button onclick="openAddContact()">Start New Chat</button></div>`;
        return;
    }

    const pinned = [], normal = [], archived = [];
    contacts.forEach(c => {
        const state = ChatsStorage.getChatState(c.id);
        if (state.archived) archived.push(c);
        else if (state.pinned) pinned.push(c);
        else normal.push(c);
    });

    const sortByTime = (arr) => arr.sort((a, b) => {
        const aMsgs = ChatsStorage.getMessages(a.id);
        const bMsgs = ChatsStorage.getMessages(b.id);
        const aTime = aMsgs.length > 0 ? new Date(aMsgs[aMsgs.length - 1].date).getTime() : 0;
        const bTime = bMsgs.length > 0 ? new Date(bMsgs[bMsgs.length - 1].date).getTime() : 0;
        return bTime - aTime;
    });

    sortByTime(pinned);
    sortByTime(normal);
    sortByTime(archived);

    let html = '';

    if (pinned.length > 0) {
        html += `<div class="section-divider"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>Pinned</div>`;
        html += pinned.map(c => renderChatItem(c)).join('');
    }

    if (normal.length > 0) {
        if (pinned.length > 0) html += `<div class="section-divider">All Chats</div>`;
        html += normal.map(c => renderChatItem(c)).join('');
    }

    if (archived.length > 0) {
        html += `<div class="section-divider"><svg viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12l.94 1H5.12z"/></svg>Archived</div>`;
        html += archived.map(c => renderChatItem(c)).join('');
    }

    list.innerHTML = html;

    document.querySelectorAll('.chat-item').forEach(el => {
        let timer;
        el.addEventListener('touchstart', () => {
            timer = setTimeout(() => openChatMenu(el.dataset.contactId), 600);
        });
        el.addEventListener('touchend', () => clearTimeout(timer));
        el.addEventListener('touchmove', () => clearTimeout(timer));
        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            openChatMenu(el.dataset.contactId);
        });
    });
}

function renderChatItem(c) {
    const msgs = ChatsStorage.getMessages(c.id);
    const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
    const preview = lastMsg ? lastMsg.text : 'Tap to start chatting';
    const time = lastMsg ? lastMsg.time : '';
    const unread = msgs.filter(m => !m.sent && !m.read).length;
    const state = ChatsStorage.getChatState(c.id);

    const groupPhoto = c.isGroup ? localStorage.getItem('msgx_group_photo_' + c.id) : null;
    const contactPhoto = !c.isGroup ? ChatsStorage.getContactPhoto(c.id) : null;
    const savedPhoto = groupPhoto || contactPhoto;

    let icon;
    if (savedPhoto) {
        icon = `<img src="${savedPhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    } else if (c.isGroup) {
        icon = '<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff;"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>';
    } else {
        icon = c.name.charAt(0).toUpperCase();
    }

    let iconsHtml = '<div class="chat-icons">';
    if (state.pinned) iconsHtml += '<span><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg></span>';
    if (state.muted) iconsHtml += '<span class="mute-icon"><svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></span>';
    if (state.archived) iconsHtml += '<span class="archive-icon"><svg viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12l.94 1H5.12z"/></svg></span>';
    iconsHtml += '</div>';

    const classes = ['chat-item'];
    if (state.pinned) classes.push('pinned');
    if (state.archived) classes.push('archived');

    return `<a href="chat.html?id=${c.id}" class="${classes.join(' ')}" data-contact-id="${c.id}">
        <div class="chat-avatar" style="background:linear-gradient(135deg, #8800ff, #00aaff);overflow:hidden;">${icon}</div>
        <div class="chat-body">
            <div class="chat-top">
                <span class="chat-name">${c.name}</span>
                ${time ? `<span class="chat-time">${time}</span>` : ''}
            </div>
            <div class="chat-bottom">
                <span class="chat-preview">${preview}</span>
                ${iconsHtml}
                ${unread > 0 && !state.muted ? `<span class="chat-badge">${unread}</span>` : ''}
            </div>
        </div>
    </a>`;
}

function openChatMenu(contactId) {
    const contact = ChatsStorage.getContact(contactId);
    if (!contact) return;
    const state = ChatsStorage.getChatState(contactId);

    const modal = document.createElement('div');
    modal.className = 'modal show';
    modal.id = 'chatMenuModal';
    modal.innerHTML = `
        <div class="modal-content">
            <h2>${contact.name}</h2>
            <p style="color:#8888bb;font-size:12px;margin-bottom:20px;text-align:center;">
                ${contact.isGroup ? 'Group Chat' : (contact.phone || 'No phone number')}
            </p>
            <div style="display:flex;flex-direction:column;gap:10px;">
                <button onclick="openChat('${contactId}')" style="padding:14px;background:linear-gradient(135deg,#8800ff,#00aaff);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    Open Chat
                </button>
                <button onclick="viewProfile('${contactId}')" style="padding:14px;background:rgba(0,170,255,0.1);color:#00aaff;border:1px solid #00aaff;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#00aaff;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    View Profile
                </button>
                <button onclick="pinChat('${contactId}')" style="padding:14px;background:rgba(136,0,255,0.1);color:#8800ff;border:1px solid #8800ff;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#8800ff;"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
                    ${state.pinned ? 'Unpin' : 'Pin'} Chat
                </button>
                <button onclick="muteChat('${contactId}')" style="padding:14px;background:rgba(255,170,0,0.1);color:#ffaa00;border:1px solid #ffaa00;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#ffaa00;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    ${state.muted ? 'Unmute' : 'Mute'} Chat
                </button>
                <button onclick="archiveChat('${contactId}')" style="padding:14px;background:rgba(136,136,187,0.1);color:#8888bb;border:1px solid #8888bb;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#8888bb;"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12l.94 1H5.12z"/></svg>
                    ${state.archived ? 'Unarchive' : 'Archive'} Chat
                </button>
                <button onclick="markChatRead('${contactId}')" style="padding:14px;background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid #00ff88;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#00ff88;"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>
                    Mark as Read
                </button>
                <button onclick="clearChatMessages('${contactId}')" style="padding:14px;background:rgba(255,170,0,0.1);color:#ffaa00;border:1px solid #ffaa00;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#ffaa00;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Clear Messages
                </button>
                <button onclick="deleteChat('${contactId}')" style="padding:14px;background:rgba(255,50,100,0.1);color:#ff3366;border:1px solid #ff3366;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#ff3366;">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        <path d="M11 9h2v6h-2zM11 17h2v2h-2z" fill="#fff"/>
                    </svg>
                    Delete Contact
                </button>
                <button onclick="closeModal('chatMenuModal')" style="padding:14px;background:transparent;color:#8888bb;border:1px solid rgba(136,0,255,0.3);border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;">
                    Cancel
                </button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function viewProfile(contactId) {
    closeModal('chatMenuModal');
    const c = ChatsStorage.getContact(contactId);
    if (c && c.isGroup) {
        window.location.href = 'group-info.html?id=' + contactId;
    } else {
        window.location.href = 'profile.html?id=' + contactId;
    }
}

function pinChat(contactId) {
    ChatsStorage.togglePin(contactId);
    closeModal('chatMenuModal');
    renderChats();
    const s = ChatsStorage.getChatState(contactId);
    alert(s.pinned ? 'Chat pinned!' : 'Chat unpinned');
}

function muteChat(contactId) {
    ChatsStorage.toggleMute(contactId);
    closeModal('chatMenuModal');
    renderChats();
    const s = ChatsStorage.getChatState(contactId);
    alert(s.muted ? 'Chat muted!' : 'Chat unmuted');
}

function archiveChat(contactId) {
    ChatsStorage.toggleArchive(contactId);
    closeModal('chatMenuModal');
    renderChats();
    const s = ChatsStorage.getChatState(contactId);
    alert(s.archived ? 'Chat archived!' : 'Chat unarchived');
}

function openChat(contactId) { window.location.href = 'chat.html?id=' + contactId; }

function markChatRead(contactId) {
    const msgs = ChatsStorage.getMessages(contactId);
    msgs.forEach(m => m.read = true);
    ChatsStorage.saveMessages(contactId, msgs);
    closeModal('chatMenuModal');
    renderChats();
    alert('Chat marked as read');
}

function clearChatMessages(contactId) {
    if (confirm('Clear all messages in this chat?')) {
        ChatsStorage.clearMessages(contactId);
        closeModal('chatMenuModal');
        renderChats();
        alert('Messages cleared');
    }
}

function deleteChat(contactId) {
    if (confirm('Delete this contact and all messages?')) {
        ChatsStorage.deleteContact(contactId);
        closeModal('chatMenuModal');
        renderChats();
        alert('Contact deleted');
    }
}

function openAddContact() { document.getElementById('addModal').classList.add('show'); }
function closeAddContact() { document.getElementById('addModal').classList.remove('show'); }
function saveContact() {
    const name = document.getElementById('contactName').value.trim();
    const phone = document.getElementById('contactPhone').value.trim();
    if (!name) { alert('Please enter a name'); return; }
    ChatsStorage.addContact(name, phone);
    closeAddContact();
    renderChats();
    document.getElementById('contactName').value = '';
    document.getElementById('contactPhone').value = '';
}
function markAllRead() {
    document.getElementById('dropdownMenu').classList.remove('show');
    const contacts = ChatsStorage.getContacts();
    contacts.forEach(c => {
        const msgs = ChatsStorage.getMessages(c.id);
        msgs.forEach(m => m.read = true);
        ChatsStorage.saveMessages(c.id, msgs);
    });
    renderChats();
    alert('All messages marked as read');
}

function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('show');
    if (modal && modal.parentNode) modal.remove();
}

document.addEventListener('click', (e) => {
    const menu = document.getElementById('dropdownMenu');
    if (menu && !e.target.closest('.app-bar')) menu.classList.remove('show');
});
</script>
</body>
</html>
