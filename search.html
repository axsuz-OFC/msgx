<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <a href="index.html" style="text-decoration:none;display:flex;align-items:center;">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#b0b0d0;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <h1>Search</h1>
    <div class="app-bar-actions"></div>
</header>

<main class="container">
    <div style="position:relative;margin-bottom:20px;">
        <svg viewBox="0 0 24 24" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:#6666aa;">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search chats, messages..." autofocus
            style="width:100%;padding:14px 20px 14px 48px;background:rgba(0,0,0,0.5);border:1px solid rgba(136,0,255,0.3);border-radius:25px;color:#fff;font-size:15px;font-family:inherit;outline:none;">
    </div>

    <div id="searchResults"></div>
</main>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderBottomNav();
    showRecent();
    
    const input = document.getElementById('searchInput');
    input.focus();
    input.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        if (query.length === 0) {
            showRecent();
        } else {
            searchAll(query);
        }
    });
});

function showRecent() {
    const results = document.getElementById('searchResults');
    const contacts = ChatsStorage.getContacts();
    
    if (contacts.length === 0) {
        results.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="#6666aa" width="70" height="70"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
                <p>No chats to search</p>
                <p style="font-size:12px;color:#6666aa;">Add contacts to start searching</p>
            </div>
        `;
        return;
    }
    
    results.innerHTML = `
        <div class="section-title">💬 Recent Chats</div>
        ${contacts.slice(0, 10).map(c => renderChatItem(c)).join('')}
    `;
}

function searchAll(query) {
    const results = document.getElementById('searchResults');
    const lowerQuery = query.toLowerCase();
    
    const contacts = ChatsStorage.getContacts();
    const matchedContacts = contacts.filter(c => c.name.toLowerCase().includes(lowerQuery));
    
    const matchedMessages = [];
    contacts.forEach(c => {
        const msgs = ChatsStorage.getMessages(c.id);
        msgs.forEach(m => {
            if (m.text.toLowerCase().includes(lowerQuery)) {
                matchedMessages.push({ ...m, contactName: c.name, contactId: c.id });
            }
        });
    });
    
    const statuses = ChatsStorage.getActiveStatuses();
    const matchedStatuses = statuses.filter(s => 
        s.type === 'text' && s.content.toLowerCase().includes(lowerQuery)
    );
    
    if (matchedContacts.length === 0 && matchedMessages.length === 0 && matchedStatuses.length === 0) {
        results.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="#6666aa" width="70" height="70"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
                <p>No results for "${query}"</p>
                <p style="font-size:12px;color:#6666aa;">Try different keywords</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    
    if (matchedContacts.length > 0) {
        html += `<div class="section-title">👤 Contacts (${matchedContacts.length})</div>`;
        html += matchedContacts.map(c => renderChatItem(c, query)).join('');
    }
    
    if (matchedMessages.length > 0) {
        html += `<div class="section-title" style="margin-top:20px;">💬 Messages (${matchedMessages.length})</div>`;
        html += matchedMessages.slice(0, 30).map(m => `
            <a href="chat.html?id=${m.contactId}" class="chat-item" style="text-decoration:none;">
                <div class="chat-avatar" style="background:${getAvatarColor(m.contactName)};">
                    ${m.contactName.charAt(0).toUpperCase()}
                </div>
                <div class="chat-body">
                    <div class="chat-top">
                        <span class="chat-name">${m.contactName}</span>
                        <span class="chat-time">${m.time}</span>
                    </div>
                    <div class="chat-bottom">
                        <span class="chat-preview">${highlightText(m.text, query)}</span>
                    </div>
                </div>
            </a>
        `).join('');
    }
    
    if (matchedStatuses.length > 0) {
        html += `<div class="section-title" style="margin-top:20px;">📸 Status (${matchedStatuses.length})</div>`;
        html += matchedStatuses.map(s => `
            <div class="settings-item" style="background:${s.bgColor};">
                <div style="color:#fff;font-size:13px;">${highlightText(s.content, query)}</div>
            </div>
        `).join('');
    }
    
    results.innerHTML = html;
}

function renderChatItem(c, query = '') {
    const msgs = ChatsStorage.getMessages(c.id);
    const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
    const preview = lastMsg ? lastMsg.text : 'No messages';
    const time = lastMsg ? lastMsg.time : '';
    const icon = c.isGroup ? 
        '<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff;"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>' 
        : c.name.charAt(0).toUpperCase();

    return `
        <a href="chat.html?id=${c.id}" class="chat-item" style="text-decoration:none;">
            <div class="chat-avatar" style="background:${getAvatarColor(c.name)};">
                ${icon}
            </div>
            <div class="chat-body">
                <div class="chat-top">
                    <span class="chat-name">${highlightText(c.name, query)} ${c.isGroup ? '<span style="color:#8800ff;font-size:10px;">(Group)</span>' : ''}</span>
                    <span class="chat-time">${time}</span>
                </div>
                <div class="chat-bottom">
                    <span class="chat-preview">${highlightText(preview, query)}</span>
                </div>
            </div>
        </a>
    `;
}

function highlightText(text, query) {
    if (!query) return text;
    const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
    return text.replace(regex, '<span style="background:#8800ff;color:#fff;padding:1px 3px;border-radius:3px;">$1</span>');
}

function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function getAvatarColor(name) {
    const colors = [
        'linear-gradient(135deg, #8800ff, #00aaff)',
        'linear-gradient(135deg, #ff0080, #8800ff)',
        'linear-gradient(135deg, #00aaff, #00ff88)',
        'linear-gradient(135deg, #ff6600, #ff0080)',
        'linear-gradient(135deg, #9c27b0, #00aaff)'
    ];
    return colors[name.charCodeAt(0) % colors.length];
}
</script>

</body>
</html>
