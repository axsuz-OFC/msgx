<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8800ff">
<title>Login - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="#8800ff" width="80" height="80"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
    </div>
    <h1 class="auth-title">MsGX</h1>
    <p class="auth-subtitle">Feature Messaging</p>

    <div class="auth-card">
        <h2>Login</h2>
        <p class="auth-error" id="errorMsg" style="display:none;"></p>

        <div class="auth-input-group">
            <svg viewBox="0 0 24 24" class="auth-input-icon"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        </div>

        <div class="auth-input-group">
            <svg viewBox="0 0 24 24" class="auth-input-icon"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        </div>

        <label style="display:flex;align-items:center;gap:10px;margin:15px 0;cursor:pointer;color:#8888bb;font-size:13px;">
            <input type="checkbox" id="rememberMe" style="width:18px;height:18px;accent-color:#8800ff;cursor:pointer;">
            Remember me on this device
        </label>

        <button class="auth-btn" onclick="handleLogin()">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            Login
        </button>

        <p class="auth-link">Don't have an account? <a href="register.html">Sign Up</a></p>
    </div>
</div>

<script src="js/chats.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadGlobalWallpaper();
    // Auto-redirect if logged in (not in test mode)
    const urlParams = new URLSearchParams(window.location.search);
    if (ChatsStorage.isLoggedIn() && urlParams.get('test') !== '1') {
        window.location.href = 'index.html';
    }
});

function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorMsg = document.getElementById('errorMsg');

    if (!email || !password) {
        errorMsg.textContent = 'Please fill all fields';
        errorMsg.style.display = 'block';
        return;
    }

    const result = ChatsStorage.loginUser(email, password);
    if (result.success) {
        window.location.href = 'index.html';
    } else {
        errorMsg.textContent = result.message;
        errorMsg.style.display = 'block';
    }
}
</script>

</body>
</html>
