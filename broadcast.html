<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <a href="index.html" style="text-decoration:none;display:flex;align-items:center;">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#b0b0d0;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <h1>Broadcast Lists</h1>
    <div class="app-bar-actions"></div>
</header>

<main class="container">
    <div class="settings-item">
        <div class="settings-item-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8800ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg>
            List Name
        </div>
        <input type="text" id="broadcastName" placeholder="Enter list name" style="width:100%;padding:14px;background:rgba(0,0,0,0.5);border:1px solid rgba(136,0,255,0.3);border-radius:10px;color:#fff;font-size:15px;outline:none;margin-top:8px;">
    </div>

    <div class="settings-item">
        <div class="settings-item-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8800ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Select Recipients
        </div>
        <div class="settings-item-sub">Choose who receives the broadcast</div>
        <div id="recipientList" style="max-height:400px;overflow-y:auto;margin-top:10px;"></div>
    </div>

    <button onclick="createBroadcast()" class="settings-btn" style="margin-top:15px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Create Broadcast List
    </button>

    <div class="section-title" style="margin-top:30px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
        My Broadcast Lists
    </div>
    <div id="broadcastList"></div>
</main>

<script src="js/chats.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderRecipients();
    renderBroadcasts();
});

function renderRecipients() {
    const list = document.getElementById('recipientList');
    const contacts = ChatsStorage.getContacts().filter(c => !c.isGroup);

    if (contacts.length === 0) {
        list.innerHTML = '<p style="color:#6666aa;font-size:13px;text-align:center;padding:20px;">No contacts available</p>';
        return;
    }

    list.innerHTML = contacts.map(c => `
        <label style="display:flex;align-items:center;gap:12px;padding:12px;background:rgba(0,0,0,0.3);border-radius:10px;margin-bottom:8px;cursor:pointer;">
            <input type="checkbox" value="${c.id}" style="width:20px;height:20px;accent-color:#8800ff;cursor:pointer;">
            <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8800ff,#00aaff);color:#fff;font-weight:700;">${c.name.charAt(0).toUpperCase()}</div>
            <div style="color:#fff;font-size:14px;font-weight:600;">${c.name}</div>
        </label>
    `).join('');
}

function renderBroadcasts() {
    const list = document.getElementById('broadcastList');
    const broadcasts = ChatsStorage.getBroadcasts();

    if (broadcasts.length === 0) {
        list.innerHTML = '<p style="color:#6666aa;font-size:12px;text-align:center;padding:15px;">No broadcast lists yet</p>';
        return;
    }

    list.innerHTML = broadcasts.map(b => `
        <div class="settings-item">
            <div class="settings-item-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8800ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg>
                ${b.name}
            </div>
            <div class="settings-item-sub">${b.members.length} recipients</div>
        </div>
    `).join('');
}

function createBroadcast() {
    const name = document.getElementById('broadcastName').value.trim();
    if (!name) { alert('Please enter list name'); return; }

    const checked = document.querySelectorAll('#recipientList input:checked');
    const members = Array.from(checked).map(c => c.value);

    if (members.length === 0) { alert('Select at least one recipient'); return; }

    ChatsStorage.addBroadcast(name, members);
    alert('Broadcast list created!');
    window.location.href = 'index.html';
}
</script>

</body>
</html>
