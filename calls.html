<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calls - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <h1>MsGX</h1>
    <div class="app-bar-actions">
        <button onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </button>
    </div>
</header>

<div class="tabs">
    <button class="tab" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        Chats
    </button>
    <button class="tab" onclick="window.location.href='status.html'">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        Status
    </button>
    <button class="tab active">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        Calls
    </button>
</div>

<main class="container">
    <button onclick="startNewCall()" class="settings-btn" style="margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#fff;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        Start New Call
    </button>

    <div class="section-title">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#8800ff;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        Recent Calls
    </div>
    <div id="callsList"></div>
</main>

<div class="modal" id="startCallModal">
    <div class="modal-content">
        <h2>Start Call</h2>
        <p style="color:#8888bb;font-size:12px;margin-bottom:15px;text-align:center;">Select contact to call</p>
        <div id="contactPicker" style="max-height:300px;overflow-y:auto;margin-bottom:15px;"></div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('startCallModal')">Cancel</button>
        </div>
    </div>
</div>

<div class="call-screen" id="callScreen">
    <div class="call-bg"></div>
    <div class="call-content">
        <div class="call-avatar" id="callAvatar">U</div>
        <div class="call-name" id="callName">Unknown</div>
        <div class="call-status" id="callStatus">Calling...</div>
        <div class="call-timer" id="callTimer">00:00</div>
        
        <div class="call-actions">
            <button class="call-btn mute" onclick="toggleMute()">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            
            <button class="call-btn end" onclick="endCall()">
                <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
            
            <button class="call-btn speaker" onclick="toggleSpeaker()">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
        </div>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
let currentCallContact = null;
let callTimerInterval = null;
let callSeconds = 0;
let isMuted = false;
let isSpeaker = false;

document.addEventListener('DOMContentLoaded', () => {
    renderBottomNav();
    renderCalls();
});

function renderCalls() {
    const list = document.getElementById('callsList');
    const contacts = ChatsStorage.getContacts();
    
    if (contacts.length === 0) {
        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="#6666aa" width="70" height="70"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                </div>
                <p>No calls yet</p>
                <p style="font-size:12px;color:#6666aa;">Tap "Start New Call" to begin</p>
            </div>
        `;
        return;
    }
    
    list.innerHTML = contacts.map(c => `
        <div class="chat-item" style="cursor:pointer;" onclick="openContactCallOptions('${c.id}')">
            <div class="chat-avatar" style="background:${getAvatarColor(c.name)};">
                ${c.name.charAt(0).toUpperCase()}
            </div>
            <div class="chat-body">
                <div class="chat-top">
                    <span class="chat-name">${c.name}</span>
                </div>
                <div class="chat-bottom">
                    <span class="chat-preview">${c.phone || 'Tap to call'}</span>
                </div>
            </div>
            <div style="display:flex;gap:8px;">
                <button onclick="event.stopPropagation(); startAudioCall('${c.id}')" style="background:rgba(0,170,255,0.15);border:1px solid #00aaff;color:#00aaff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#00aaff;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                </button>
                <button onclick="event.stopPropagation(); startVideoCall('${c.id}')" style="background:rgba(136,0,255,0.15);border:1px solid #8800ff;color:#8800ff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#8800ff;"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                </button>
            </div>
        </div>
    `).join('');
}

function getAvatarColor(name) {
    const colors = [
        'linear-gradient(135deg, #8800ff, #00aaff)',
        'linear-gradient(135deg, #ff0080, #8800ff)',
        'linear-gradient(135deg, #00aaff, #00ff88)',
        'linear-gradient(135deg, #ff6600, #ff0080)',
        'linear-gradient(135deg, #9c27b0, #00aaff)'
    ];
    return colors[name.charCodeAt(0) % colors.length];
}

function startNewCall() {
    const picker = document.getElementById('contactPicker');
    const contacts = ChatsStorage.getContacts();
    
    if (contacts.length === 0) {
        picker.innerHTML = '<p style="color:#6666aa;font-size:13px;text-align:center;padding:20px;">No contacts available</p>';
    } else {
        picker.innerHTML = contacts.map(c => `
            <div onclick="openContactCallOptions('${c.id}')" style="display:flex;align-items:center;gap:12px;padding:12px;background:rgba(0,0,0,0.3);border-radius:10px;margin-bottom:8px;cursor:pointer;">
                <div class="chat-avatar" style="width:40px;height:40px;font-size:16px;background:${getAvatarColor(c.name)};">${c.name.charAt(0).toUpperCase()}</div>
                <div style="color:#fff;font-size:14px;font-weight:600;">${c.name}</div>
            </div>
        `).join('');
    }
    
    document.getElementById('startCallModal').classList.add('show');
}

function openContactCallOptions(contactId) {
    closeModal('startCallModal');
    const c = ChatsStorage.getContact(contactId);
    if (!c) return;
    
    const modal = document.createElement('div');
    modal.className = 'modal show';
    modal.id = 'callOptionsModal';
    modal.innerHTML = `
        <div class="modal-content">
            <h2>${c.name}</h2>
            <p style="color:#8888bb;font-size:12px;margin-bottom:20px;text-align:center;">${c.phone || 'No phone number'}</p>
            <div style="display:flex;flex-direction:column;gap:10px;">
                <button onclick="startAudioCall('${contactId}')" style="padding:14px;background:rgba(0,170,255,0.15);color:#00aaff;border:1px solid #00aaff;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#00aaff;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    Voice Call
                </button>
                <button onclick="startVideoCall('${contactId}')" style="padding:14px;background:rgba(136,0,255,0.15);color:#8800ff;border:1px solid #8800ff;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#8800ff;"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    Video Call
                </button>
                ${c.phone ? `
                <a href="https://wa.me/${c.phone.replace(/[^0-9]/g, '')}" target="_blank" style="padding:14px;background:rgba(37,211,102,0.15);color:#25D366;border:1px solid #25D366;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;">
                    <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#25D366;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 13.5c-.3.8-1.5 1.5-2.1 1.5-.5 0-1.2-.1-2.5-.7-1.9-.9-3.4-2.4-4.4-4.3-.6-1.3-.7-2-.7-2.5 0-.6.7-1.8 1.5-2.1.3-.1.6 0 .8.4.2.5.7 1.5.7 1.7 0 .1 0 .2-.1.3-.2.3-.5.6-.6.7-.1.1-.2.3-.1.5.5.9 1.5 1.9 2.4 2.4.2.1.4 0 .5-.1.1-.1.4-.4.7-.6.1-.1.2-.2.3-.1.2.1 1.2.6 1.7.7.4.2.5.5.4.8z"/></svg>
                    WhatsApp Call
                </a>
                ` : ''}
                <button onclick="closeModal('callOptionsModal')" style="padding:14px;background:transparent;color:#8888bb;border:1px solid rgba(136,0,255,0.3);border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;">Cancel</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function startAudioCall(contactId) {
    closeModal('callOptionsModal');
    closeModal('startCallModal');
    const c = ChatsStorage.getContact(contactId);
    if (!c) return;
    currentCallContact = c;
    showCallScreen(c, 'voice');
}

function startVideoCall(contactId) {
    closeModal('callOptionsModal');
    closeModal('startCallModal');
    const c = ChatsStorage.getContact(contactId);
    if (!c) return;
    currentCallContact = c;
    showCallScreen(c, 'video');
}

function showCallScreen(contact, type) {
    document.getElementById('callAvatar').textContent = contact.name.charAt(0).toUpperCase();
    document.getElementById('callAvatar').style.background = getAvatarColor(contact.name);
    document.getElementById('callName').textContent = contact.name;
    document.getElementById('callStatus').textContent = type === 'video' ? 'Video calling...' : 'Calling...';
    document.getElementById('callTimer').textContent = '00:00';
    document.getElementById('callScreen').classList.add('show');
    
    callSeconds = 0;
    isMuted = false;
    isSpeaker = false;
    
    setTimeout(() => {
        document.getElementById('callStatus').textContent = 'Connecting...';
        setTimeout(() => {
            document.getElementById('callStatus').textContent = 'Connected';
            startCallTimer();
        }, 2000);
    }, 1500);
}

function startCallTimer() {
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
        const secs = (callSeconds % 60).toString().padStart(2, '0');
        document.getElementById('callTimer').textContent = `${mins}:${secs}`;
    }, 1000);
}

function endCall() {
    if (callTimerInterval) clearInterval(callTimerInterval);
    
    const duration = callSeconds > 0 ? 
        `${Math.floor(callSeconds / 60)}:${(callSeconds % 60).toString().padStart(2, '0')}` : 
        'Missed';
    
    if (currentCallContact) {
        const log = JSON.parse(localStorage.getItem('msgx_calllog') || '[]');
        log.unshift({
            id: Date.now(),
            contactId: currentCallContact.id,
            contactName: currentCallContact.name,
            duration: duration,
            timestamp: new Date().toISOString()
        });
        localStorage.setItem('msgx_calllog', JSON.stringify(log.slice(0, 50)));
    }
    
    document.getElementById('callScreen').classList.remove('show');
    currentCallContact = null;
    callSeconds = 0;
    alert(`Call ended • Duration: ${duration}`);
}

function toggleMute() {
    isMuted = !isMuted;
    document.querySelector('.call-btn.mute').style.background = isMuted ? '#ff3366' : 'rgba(255,255,255,0.15)';
    alert(isMuted ? 'Muted' : 'Unmuted');
}

function toggleSpeaker() {
    isSpeaker = !isSpeaker;
    alert(isSpeaker ? 'Speaker ON' : 'Speaker OFF');
}

function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('show');
}
</script>

</body>
</html>
