<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel Info - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <a href="#" onclick="goBack(); return false;" style="text-decoration:none;display:flex;align-items:center;">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#b0b0d0;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <h1>Channel Info</h1>
    <div class="app-bar-actions"></div>
</header>

<main class="container" id="infoContent"></main>

<div class="modal" id="editChannelModal">
    <div class="modal-content">
        <h2>Edit Channel</h2>
        <input type="text" id="editChannelName" placeholder="Channel name">
        <input type="text" id="editChannelDesc" placeholder="Description">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('editChannelModal')">Cancel</button>
            <button class="btn-save" onclick="saveChannelEdit()">Save</button>
        </div>
    </div>
</div>

<div class="modal" id="addAdminModal">
    <div class="modal-content">
        <h2>Add Admin</h2>
        <p style="color:#8888bb;font-size:12px;margin-bottom:15px;">Enter contact name to add as admin</p>
        <input type="text" id="newAdminName" placeholder="Contact name">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('addAdminModal')">Cancel</button>
            <button class="btn-save" onclick="addAdmin()">Add</button>
        </div>
    </div>
</div>

<input type="file" id="channelPhotoInput" accept="image/*" style="display:none;">

<script src="js/chats.js"></script>
<script>
let channelId = null;
let channel = null;
let isAdmin = false;

document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    loadGlobalWallpaper();
    const params = new URLSearchParams(window.location.search);
    channelId = params.get('id');
    if (!channelId) { window.location.href = 'channels.html'; return; }
    channel = ChatsStorage.getChannel(channelId);
    if (!channel) { window.location.href = 'channels.html'; return; }
    isAdmin = ChatsStorage.isChannelAdmin(channelId);
    renderInfo();
});

document.getElementById('channelPhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        ChatsStorage.saveChannelPhoto(channelId, ev.target.result);
        renderInfo();
        alert('Channel photo updated!');
    };
    reader.readAsDataURL(file);
});

function goBack() {
    window.location.href = 'channel.html?id=' + channelId;
}

function renderInfo() {
    channel = ChatsStorage.getChannel(channelId);
    isAdmin = ChatsStorage.isChannelAdmin(channelId);

    const photo = ChatsStorage.getChannelPhoto(channelId);
    const initial = channel.name.charAt(0).toUpperCase();
    const followers = (channel.followers || []).length;
    const admins = channel.admins || [];
    const posts = ChatsStorage.getChannelPosts(channelId).length;

    const avatarContent = photo ? `<img src="${photo}">` : initial;

    document.getElementById('infoContent').innerHTML = `
        <div class="channel-view-header" style="border-radius:20px;margin-bottom:20px;">
            <div class="channel-view-avatar" style="${isAdmin ? 'cursor:pointer;' : ''}" ${isAdmin ? `onclick="document.getElementById('channelPhotoInput').click()"` : ''}>
                ${avatarContent}
            </div>
            <div class="channel-view-name">
                ${channel.name}
                ${channel.isVerified ? '<span class="channel-verified" style="width:22px;height:22px;"><svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' : ''}
            </div>
            <div class="channel-view-desc">${channel.description || 'No description'}</div>
            <div class="channel-view-stats">
                <span><strong>${followers}</strong>Followers</span>
                <span><strong>${posts}</strong>Posts</span>
                <span><strong>${admins.length}</strong>Admins</span>
            </div>
        </div>

        ${isAdmin ? `
        <div class="settings-list">
            <div class="settings-row" onclick="editChannel()">
                <div class="settings-row-icon" style="background:rgba(136,0,255,0.15);">
                    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#8800ff;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </div>
                <div class="settings-row-text">
                    <div class="settings-row-title">Edit Channel</div>
                    <div class="settings-row-sub">Change name & description</div>
                </div>
                <div class="settings-row-arrow"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></div>
            </div>
            <div class="settings-row" onclick="document.getElementById('channelPhotoInput').click()">
                <div class="settings-row-icon" style="background:rgba(0,170,255,0.15);">
                    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#00aaff;"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </div>
                <div class="settings-row-text">
                    <div class="settings-row-title">Change Photo</div>
                    <div class="settings-row-sub">Upload new channel icon</div>
                </div>
                <div class="settings-row-arrow"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></div>
            </div>
            <div class="settings-row" onclick="openAddAdmin()">
                <div class="settings-row-icon" style="background:rgba(0,255,136,0.15);">
                    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#00ff88;"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="settings-row-text">
                    <div class="settings-row-title">Add Admin</div>
                    <div class="settings-row-sub">Add a contact as admin</div>
                </div>
                <div class="settings-row-arrow"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></div>
            </div>
        </div>
        ` : ''}

        <div class="settings-item" style="margin-top:15px;">
            <div class="settings-item-title">Admins (${admins.length})</div>
            <div style="margin-top:12px;" id="adminList"></div>
        </div>

        ${isAdmin ? `
        <button onclick="deleteChannelConfirm()" class="settings-btn danger" style="margin-top:20px;">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#ff3366;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Delete Channel
        </button>
        ` : ''}
    `;

    renderAdmins();
}

function renderAdmins() {
    const list = document.getElementById('adminList');
    if (!list) return;
    const admins = channel.admins || [];
    const user = ChatsStorage.getCurrentUser();
    const currentUserId = user ? user.id : 'guest';

    if (admins.length === 0) {
        list.innerHTML = '<p style="color:#6666aa;font-size:12px;">No admins</p>';
        return;
    }

    list.innerHTML = admins.map(aId => {
        const isOwner = aId === channel.ownerId;
        const isMe = aId === currentUserId;
        const name = isOwner ? (channel.ownerName || 'Owner') : (isMe ? 'You' : 'Admin ' + String(aId).slice(-4));

        return `<div class="admin-list-item">
            <div class="chat-avatar" style="width:40px;height:40px;font-size:16px;background:linear-gradient(135deg,#8800ff,#00aaff);">${name.charAt(0).toUpperCase()}</div>
            <div style="flex:1;">
                <div style="color:#fff;font-size:14px;font-weight:600;">${name}${isMe ? ' (You)' : ''}</div>
                <div style="color:#8888bb;font-size:11px;margin-top:2px;">
                    ${isOwner ? '<span class="admin-badge">Owner</span>' : '<span class="admin-badge">Admin</span>'}
                </div>
            </div>
            ${!isOwner && isAdmin && !isMe ? `<button onclick="removeAdmin('${aId}')" style="background:transparent;color:#ff3366;border:1px solid #ff3366;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;">Remove</button>` : ''}
        </div>`;
    }).join('');
}

function editChannel() {
    document.getElementById('editChannelName').value = channel.name;
    document.getElementById('editChannelDesc').value = channel.description || '';
    document.getElementById('editChannelModal').classList.add('show');
}

function saveChannelEdit() {
    const name = document.getElementById('editChannelName').value.trim();
    const desc = document.getElementById('editChannelDesc').value.trim();
    if (!name) { alert('Please enter name'); return; }
    ChatsStorage.updateChannel(channelId, { name, description: desc });
    closeModal('editChannelModal');
    renderInfo();
    alert('Channel updated!');
}

function openAddAdmin() {
    document.getElementById('newAdminName').value = '';
    document.getElementById('addAdminModal').classList.add('show');
}

function addAdmin() {
    const name = document.getElementById('newAdminName').value.trim();
    if (!name) { alert('Please enter name'); return; }

    // Find contact by name
    const contacts = ChatsStorage.getContacts();
    const contact = contacts.find(c => c.name.toLowerCase() === name.toLowerCase());

    if (!contact) {
        alert('Contact not found. Try exact name.');
        return;
    }

    ChatsStorage.addChannelAdmin(channelId, contact.id);
    closeModal('addAdminModal');
    renderInfo();
    alert(contact.name + ' added as admin');
}

function removeAdmin(adminId) {
    if (!confirm('Remove this admin?')) return;
    // Convert to same type
    const aId = isNaN(adminId) ? adminId : parseInt(adminId);
    ChatsStorage.removeChannelAdmin(channelId, aId);
    renderInfo();
    alert('Admin removed');
}

function deleteChannelConfirm() {
    if (!confirm('Delete this channel and all posts?')) return;
    ChatsStorage.deleteChannel(channelId);
    alert('Channel deleted');
    window.location.href = 'channels.html';
}

function closeModal(id) {
    const m = document.getElementById(id);
    if (m) m.classList.remove('show');
}
</script>
</body>
</html>
