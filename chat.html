<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="chat-view" id="chatView">
    <div class="chat-view-header" id="chatHeader"></div>

    <div class="chat-search-bar" id="chatSearchBar">
        <input type="text" id="chatSearchInput" placeholder="Search in chat..." oninput="performChatSearch()">
        <span class="search-count" id="searchCount">0/0</span>
        <button onclick="prevSearchMatch()" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button onclick="nextSearchMatch()" title="Next">
            <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
        <button class="close-search" onclick="closeChatSearch()" title="Close">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="attach-menu" id="attachMenu">
        <button onclick="attachFile('audio')">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            Audio
        </button>
        <button onclick="attachFile('video')">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            Video
        </button>
        <button onclick="attachFile('image')">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Image
        </button>
        <button onclick="attachFile('document')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Document
        </button>
        <button onclick="openPollModal()">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            Poll
        </button>
        <button onclick="attachFile('contact')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Contact
        </button>
    </div>

    <div class="reply-input-preview" id="replyInputPreview">
        <div class="reply-info">
            <div class="r-name" id="replyName">Replying to</div>
            <div class="r-text" id="replyText"></div>
        </div>
        <button class="close-reply" onclick="cancelReply()">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>

    <div class="chat-input-bar" id="chatInputBar">
        <button class="emoji-btn" onclick="toggleEmojiPicker()">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
        </button>
        <button class="attach-btn" onclick="toggleAttachMenu()">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
        </button>
        <input type="text" id="msgInput" placeholder="Message" onkeypress="if(event.key==='Enter') sendMessage()" oninput="handleInputChange()">
        <button class="schedule-btn" id="scheduleBtn" onclick="openScheduleModal()" title="Schedule message" style="display:none;">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"/></svg>
        </button>
        <button class="mic-btn" id="micBtn" onclick="startVoiceRecord()">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" style="display:none;">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <div class="voice-recording" id="voiceRecording">
        <div class="voice-indicator"></div>
        <span class="voice-timer" id="voiceTimer">00:00</span>
        <button class="voice-cancel" onclick="cancelVoiceRecord()">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <button class="voice-send" onclick="stopVoiceRecord()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<div class="reaction-picker" id="reactionPicker">
    <button onclick="addReaction('❤️')">❤️</button>
    <button onclick="addReaction('👍')">👍</button>
    <button onclick="addReaction('😂')">😂</button>
    <button onclick="addReaction('😮')">😮</button>
    <button onclick="addReaction('😢')">😢</button>
    <button onclick="addReaction('🙏')">🙏</button>
</div>

<div class="modal" id="pollModal">
    <div class="modal-content">
        <h2>Create Poll</h2>
        <input type="text" id="pollQuestion" placeholder="Ask a question...">
        <input type="text" id="pollOption1" placeholder="Option 1">
        <input type="text" id="pollOption2" placeholder="Option 2">
        <input type="text" id="pollOption3" placeholder="Option 3 (optional)">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('pollModal')">Cancel</button>
            <button class="btn-save" onclick="sendPoll()">Send Poll</button>
        </div>
    </div>
</div>

<div class="modal" id="forwardModal">
    <div class="modal-content">
        <h2>Forward to...</h2>
        <div id="forwardContactList" style="max-height:350px;overflow-y:auto;margin-bottom:15px;"></div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('forwardModal')">Cancel</button>
            <button class="btn-save" onclick="forwardMessage()" id="forwardSendBtn" disabled style="opacity:0.5;">Send</button>
        </div>
    </div>
</div>

<div class="modal" id="scheduleModal">
    <div class="modal-content">
        <h2>Schedule Message</h2>
        <p style="color:#8888bb;font-size:12px;margin-bottom:15px;">When should this message be sent?</p>
        <div class="schedule-options">
            <button class="schedule-option" data-offset="60000" onclick="selectSchedule(this, 60000)">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <div class="opt-text"><div>In 1 minute</div><div class="opt-time" id="time_60s"></div></div>
            </button>
            <button class="schedule-option" data-offset="300000" onclick="selectSchedule(this, 300000)">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <div class="opt-text"><div>In 5 minutes</div><div class="opt-time" id="time_5m"></div></div>
            </button>
            <button class="schedule-option" data-offset="3600000" onclick="selectSchedule(this, 3600000)">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <div class="opt-text"><div>In 1 hour</div><div class="opt-time" id="time_1h"></div></div>
            </button>
            <button class="schedule-option" data-offset="86400000" onclick="selectSchedule(this, 86400000)">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <div class="opt-text"><div>Tomorrow</div><div class="opt-time" id="time_1d"></div></div>
            </button>
        </div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('scheduleModal')">Cancel</button>
            <button class="btn-save" onclick="confirmSchedule()" id="scheduleConfirmBtn" disabled style="opacity:0.5;">Schedule</button>
        </div>
    </div>
</div>

<div class="modal" id="pendingScheduleModal">
    <div class="modal-content">
        <h2>Pending Messages</h2>
        <div id="pendingList" style="max-height:400px;overflow-y:auto;margin-bottom:15px;"></div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('pendingScheduleModal')">Close</button>
        </div>
    </div>
</div>

<input type="file" id="fileInput" style="display:none;">

<script src="js/chats.js"></script>
<script>
let contactId = null;
let contact = null;
let mediaRecorder = null;
let audioChunks = [];
let voiceSeconds = 0;
let voiceTimerInterval = null;
let replyToMsgId = null;
let reactionTargetMsgId = null;
let typingTimeout = null;
let audioSpeeds = {};
let forwardMsgId = null;
let forwardSelected = [];
let searchMatches = [];
let currentMatchIndex = 0;
let selectedScheduleOffset = null;

const EMOJIS = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','☠️','👽','👾','🤖','🎃','😺','😸','😹','😻','😼','😽','🙀','😿','😾','👋','🤚','🖐️','✋','🖖','👌','🤌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💅','🤳','💪','🦾','🦿','🦵','🦶','👂','🦻','👃','🧠','🦷','🦴','👀','👁️','👅','👄','💋','🩸'];

document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    loadGlobalWallpaper();
    const params = new URLSearchParams(window.location.search);
    contactId = params.get('id');
    if (!contactId) { window.location.href = 'index.html'; return; }
    contact = ChatsStorage.getContact(contactId);
    if (!contact) { window.location.href = 'index.html'; return; }

    const groupPhoto = contact.isGroup ? localStorage.getItem('msgx_group_photo_' + contactId) : null;
    let icon;
    if (contact.isGroup) {
        if (groupPhoto) {
            icon = `<img src="${groupPhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        } else {
            icon = '<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#fff;"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>';
        }
    } else {
        icon = contact.name.charAt(0).toUpperCase();
    }

    const isGroupChat = contact.isGroup;
    document.getElementById('chatHeader').innerHTML = `
        <a href="index.html" class="back">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="avatar" style="background:${getAvatarColor(contact.name)}">${icon}</div>
        <div class="info" ${isGroupChat ? 'onclick="window.location.href=\'group-info.html?id=' + contactId + '\'" style="cursor:pointer;"' : ''}>
            <div class="name">${contact.name}</div>
            <div class="status" id="chatStatus">${contact.isGroup ? (contact.members.length + ' members') : (contact.phone || 'online')}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
            <button onclick="toggleChatSearch()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#00aaff;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button onclick="showPendingMessages()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#ffaa00;"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            </button>
            ${isGroupChat ? `
            <button onclick="window.location.href='group-info.html?id=${contactId}'" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#00ff88;"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </button>
            ` : ''}
            <button onclick="startAudioCallFromChat()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#00aaff;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            </button>
            <button onclick="startVideoCallFromChat()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#8800ff;"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
        </div>
    `;

    const emojiGrid = document.getElementById('emojiGrid');
    emojiGrid.innerHTML = EMOJIS.map(e => `<button onclick="insertEmoji('${e}')">${e}</button>`).join('');

    const msgInput = document.getElementById('msgInput');
    msgInput.addEventListener('input', () => showTypingIndicator());

    renderMessages();

    setInterval(() => {
        const sent = ChatsStorage.processScheduledMessages();
        if (sent > 0) renderMessages();
        else renderMessages();
    }, 5000);
});

function getAvatarColor(name) {
    const colors = [
        'linear-gradient(135deg, #8800ff, #00aaff)',
        'linear-gradient(135deg, #ff0080, #8800ff)',
        'linear-gradient(135deg, #00aaff, #00ff88)',
        'linear-gradient(135deg, #ff6600, #ff0080)',
        'linear-gradient(135deg, #9c27b0, #00aaff)'
    ];
    return colors[name.charCodeAt(0) % colors.length];
}

function startAudioCallFromChat() { window.location.href = 'calls.html?call=' + contactId + '&type=audio'; }
function startVideoCallFromChat() { window.location.href = 'calls.html?call=' + contactId + '&type=video'; }

function toggleEmojiPicker() {
    document.getElementById('emojiPicker').classList.toggle('show');
    document.getElementById('attachMenu').classList.remove('show');
}

function insertEmoji(emoji) {
    const input = document.getElementById('msgInput');
    input.value += emoji;
    handleInputChange();
}

async function startVoiceRecord() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (ev) => {
                const extra = { fileName: 'voice_' + Date.now() + '.webm', fileSize: (audioBlob.size / 1024).toFixed(1) + ' KB', fileData: ev.target.result, duration: voiceSeconds };
                ChatsStorage.addMessage(contactId, 'Voice Message', true, 'Me', 'voice', extra);
                renderMessages();
            };
            reader.readAsDataURL(audioBlob);
            stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        voiceSeconds = 0;
        document.getElementById('voiceRecording').classList.add('show');
        document.getElementById('voiceTimer').textContent = '00:00';
        voiceTimerInterval = setInterval(() => {
            voiceSeconds++;
            const mins = Math.floor(voiceSeconds / 60).toString().padStart(2, '0');
            const secs = (voiceSeconds % 60).toString().padStart(2, '0');
            document.getElementById('voiceTimer').textContent = `${mins}:${secs}`;
        }, 1000);
    } catch (e) { alert('Microphone permission needed!'); }
}

function stopVoiceRecord() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    clearInterval(voiceTimerInterval);
    document.getElementById('voiceRecording').classList.remove('show');
}

function cancelVoiceRecord() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = () => { mediaRecorder.stream.getTracks().forEach(t => t.stop()); };
        mediaRecorder.stop();
    }
    clearInterval(voiceTimerInterval);
    document.getElementById('voiceRecording').classList.remove('show');
}

function handleInputChange() {
    const text = document.getElementById('msgInput').value.trim();
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const scheduleBtn = document.getElementById('scheduleBtn');
    if (text.length > 0) {
        micBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        scheduleBtn.style.display = 'flex';
    } else {
        micBtn.style.display = 'flex';
        sendBtn.style.display = 'none';
        scheduleBtn.style.display = 'none';
    }
}

function toggleAttachMenu() {
    document.getElementById('attachMenu').classList.toggle('show');
    document.getElementById('emojiPicker').classList.remove('show');
}

function attachFile(type) {
    document.getElementById('attachMenu').classList.remove('show');
    const input = document.getElementById('fileInput');
    const acceptTypes = { 'audio': 'audio/*', 'video': 'video/*', 'image': 'image/*', 'document': '.pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx', 'contact': 'text/vcard,.vcf' };
    input.accept = acceptTypes[type] || '*/*';
    input.onchange = (e) => handleFileSelect(e, type);
    input.click();
}

function handleFileSelect(e, type) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const extra = { fileName: file.name, fileSize: (file.size / 1024).toFixed(1) + ' KB', fileData: ev.target.result };
        let text = '';
        if (type === 'image') text = 'Photo';
        else if (type === 'video') text = 'Video';
        else if (type === 'audio') text = 'Audio';
        else if (type === 'document') text = 'Document';
        else if (type === 'contact') text = 'Contact';
        ChatsStorage.addMessage(contactId, text, true, 'Me', type, extra);
        renderMessages();
        input.value = '';
    };
    reader.readAsDataURL(file);
}

function openPollModal() {
    document.getElementById('attachMenu').classList.remove('show');
    document.getElementById('pollModal').classList.add('show');
    document.getElementById('pollQuestion').value = '';
    document.getElementById('pollOption1').value = '';
    document.getElementById('pollOption2').value = '';
    document.getElementById('pollOption3').value = '';
}

function sendPoll() {
    const question = document.getElementById('pollQuestion').value.trim();
    const opt1 = document.getElementById('pollOption1').value.trim();
    const opt2 = document.getElementById('pollOption2').value.trim();
    const opt3 = document.getElementById('pollOption3').value.trim();
    if (!question || !opt1 || !opt2) { alert('Please fill question and at least 2 options'); return; }
    const options = [opt1, opt2];
    if (opt3) options.push(opt3);
    const extra = { options: options, votes: options.map(() => 0) };
    ChatsStorage.addMessage(contactId, question, true, 'Me', 'poll', extra);
    closeModal('pollModal');
    renderMessages();
}

function renderMessages() {
    const container = document.getElementById('chatMessages');
    const messages = ChatsStorage.getMessages(contactId);
    const rgbOn = localStorage.getItem('msgx_rgb') !== 'false';
    const pendingScheduled = ChatsStorage.getScheduledForContact(contactId);

    if (messages.length === 0 && pendingScheduled.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:#6666aa;font-size:12px;padding:20px;">Messages are end-to-end encrypted</div>`;
        return;
    }

    let html = '';

    if (pendingScheduled.length > 0) {
        html += pendingScheduled.map(s => {
            const when = new Date(s.sendAt);
            const timeStr = when.toLocaleString([], { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
            return `<div class="msg sent" style="opacity:0.85;border:1px dashed #ffaa00;">
                <div class="scheduled-msg-indicator">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    Scheduled for ${timeStr}
                </div>
                <span class="msg-text-content">${formatText(s.text)}</span>
                <span class="time">Pending</span>
            </div>`;
        }).join('');
    }

    html += messages.map(m => {
        let content = '';
        let quotedHtml = '';
        let forwardedHtml = '';

        if (m.forwarded) {
            forwardedHtml = `<div class="forwarded-label">
                <svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
                Forwarded
            </div>`;
        }

        if (m.replyTo) {
            const repliedMsg = messages.find(x => x.id === m.replyTo);
            if (repliedMsg) {
                quotedHtml = `<div class="quoted-msg">
                    <div class="q-name">${repliedMsg.sent ? 'You' : contact.name}</div>
                    <div class="q-text">${formatText(repliedMsg.text || 'Message')}</div>
                </div>`;
            }
        }

        if (m.deleted) {
            content = `<div class="deleted-msg">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                This message was deleted
            </div>`;
        } else if (m.type === 'image') content = `<img src="${m.extra.fileData}" style="max-width:100%;border-radius:10px;margin-bottom:5px;">`;
        else if (m.type === 'video') content = `<video src="${m.extra.fileData}" controls style="max-width:100%;border-radius:10px;margin-bottom:5px;"></video>`;
        else if (m.type === 'voice' || m.type === 'audio') {
            const duration = m.extra.duration || 0;
            const bars = generateWaveformBars(m.id, 40);
            content = `<div class="voice-msg-container">
                <button class="voice-play-btn" id="playBtn_${m.id}" onclick="toggleVoicePlay(${m.id})">
                    <svg id="playIcon_${m.id}" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="voice-mic-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </div>
                <div class="voice-waveform" id="waveform_${m.id}" onclick="seekVoice(event, ${m.id})">
                    ${bars.map((h, i) => `<div class="bar" data-index="${i}" style="height:${h}%"></div>`).join('')}
                </div>
                <div class="voice-info">
                    <div class="voice-time" id="time_${m.id}">0:${duration.toString().padStart(2, '0')}</div>
                    <div class="voice-speed" id="speed_${m.id}" onclick="changeVoiceSpeed(${m.id})">1x</div>
                </div>
                <audio id="audio_${m.id}" src="${m.extra.fileData}" preload="metadata"></audio>
            </div>`;
        }
        else if (m.type === 'document' || m.type === 'contact') content = `<div style="display:flex;align-items:center;gap:10px;"><svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><div><div style="font-weight:600;">${m.extra.fileName}</div><div style="font-size:11px;opacity:0.7;">${m.extra.fileSize}</div></div></div>`;
        else if (m.type === 'poll') content = `<div style="font-weight:600;margin-bottom:8px;">${m.text}</div>${m.extra.options.map((opt, i) => `<div onclick="votePoll(${m.id}, ${i})" style="padding:8px 12px;background:rgba(255,255,255,0.15);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px;">${opt} <span style="float:right;opacity:0.7;">${m.extra.votes[i]} votes</span></div>`).join('')}`;
        else content = `<span class="msg-text-content">${m.starred ? '<span style="color:#ffaa00;">★</span> ' : ''}${formatText(m.text)}</span>`;

        let reactionsHtml = '';
        if (m.reactions && Object.keys(m.reactions).length > 0 && !m.deleted) {
            reactionsHtml = '<div class="msg-reactions">';
            for (const emoji in m.reactions) {
                if (m.reactions[emoji] > 0) {
                    reactionsHtml += `<span class="reaction-bubble" onclick="event.stopPropagation(); addReaction('${emoji}', ${m.id})">${emoji} <span class="reaction-count">${m.reactions[emoji]}</span></span>`;
                }
            }
            reactionsHtml += '</div>';
        }

        // Ticks (Sent/Delivered/Read)
        const sentTime = new Date(m.date);
        const elapsed = (Date.now() - sentTime.getTime()) / 1000;
        let tickHtml = '';
        if (m.sent) {
            if (elapsed < 1) tickHtml = ' ✓';
            else if (elapsed < 3) tickHtml = ' ✓✓';
            else tickHtml = ' <span style="color:#00aaff;">✓✓</span>';
        }

        const rgbClass = (rgbOn && m.type === 'text' && !m.deleted) ? 'rgb-active' : '';
        return `<div class="msg ${m.sent ? 'sent' : 'received'} ${rgbClass}" data-msg-id="${m.id}">
            ${forwardedHtml}
            ${quotedHtml}
            ${content}
            ${reactionsHtml}
            <span class="time">${m.time}${tickHtml}${m.edited ? ' <span class="edited-label">(edited)</span>' : ''}</span>
            <div class="reply-icon">
                <svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
            </div>
        </div>`;
    }).join('');

    container.innerHTML = html;

    const otherTyping = localStorage.getItem('msgx_sim_typing_' + contactId) === 'true';
    if (otherTyping && messages.length > 0) {
        container.innerHTML += `<div class="typing-bubble"><span></span><span></span><span></span></div>`;
    }

    container.scrollTop = container.scrollHeight;

    messages.forEach(m => {
        if (m.type === 'voice' || m.type === 'audio') {
            const audio = document.getElementById('audio_' + m.id);
            if (audio) {
                audio.addEventListener('timeupdate', () => updateVoiceProgress(m.id));
                audio.addEventListener('ended', () => resetVoicePlayer(m.id));
                audio.addEventListener('loadedmetadata', () => {
                    const dur = Math.floor(audio.duration);
                    const el = document.getElementById('time_' + m.id);
                    if (el && !isNaN(dur)) el.textContent = '0:' + dur.toString().padStart(2, '0');
                });
            }
        }
    });

    document.querySelectorAll('.voice-msg-container').forEach(el => {
        el.addEventListener('contextmenu', (e) => e.stopPropagation());
        el.addEventListener('touchstart', (e) => e.stopPropagation());
    });

    document.querySelectorAll('.msg').forEach(el => {
        const msgId = parseInt(el.dataset.msgId);
        let pressTimer, startX = 0, currentX = 0, isSwiping = false;
        let lastTap = 0;

        el.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            pressTimer = setTimeout(() => {
                if (!isSwiping && msgId) openMsgMenu(msgId);
            }, 600);
        });

        el.addEventListener('touchmove', (e) => {
            currentX = e.touches[0].clientX - startX;
            if (currentX > 40) {
                isSwiping = true;
                clearTimeout(pressTimer);
                el.classList.add('swiping');
            }
        });

        el.addEventListener('touchend', (e) => {
            clearTimeout(pressTimer);
            if (isSwiping && currentX > 60) setReply(msgId);
            el.classList.remove('swiping');
            isSwiping = false;
            currentX = 0;

            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                e.preventDefault();
                showHeartPopup(el);
                addReaction('❤️', msgId);
            }
            lastTap = currentTime;
        });

        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (msgId) openMsgMenu(msgId);
        });
    });

    const searchInput = document.getElementById('chatSearchInput');
    if (searchInput && searchInput.value.trim() && document.getElementById('chatSearchBar').classList.contains('show')) {
        setTimeout(() => performChatSearch(), 50);
    }
}

    const elapsed = (now - sentTime) / 1000;

    const deliveredTime = new Date(sentTime.getTime() + 1000);
    const readTime = new Date(sentTime.getTime() + 3000);

    let statusText = 'Sent';
    let statusClass = 'sent';
    if (elapsed > 3) {
        statusText = 'Read';
        statusClass = 'read';
    } else if (elapsed > 1) {
        statusText = 'Delivered';
        statusClass = 'delivered';
    }

    const formatTime = (d) => d.toLocaleString([], { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short', year: 'numeric' });

                </div>
                <div class="msg-info-text">

                    <svg viewBox="0 0 24 24"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>
                </div>

// ===== SCHEDULED MESSAGES =====
function openScheduleModal() {
    const text = document.getElementById('msgInput').value.trim();
    if (!text) { alert('Please type a message first'); return; }
    selectedScheduleOffset = null;
    document.querySelectorAll('.schedule-option').forEach(el => el.classList.remove('selected'));
    document.getElementById('scheduleConfirmBtn').disabled = true;
    document.getElementById('scheduleConfirmBtn').style.opacity = '0.5';
    updateScheduleTimes();
    document.getElementById('scheduleModal').classList.add('show');
}

function updateScheduleTimes() {
    const now = new Date();
    const times = [
        { id: 'time_60s', offset: 60000 },
        { id: 'time_5m', offset: 300000 },
        { id: 'time_1h', offset: 3600000 },
        { id: 'time_1d', offset: 86400000 }
    ];
    times.forEach(t => {
        const future = new Date(now.getTime() + t.offset);
        const el = document.getElementById(t.id);
        if (el) el.textContent = future.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    });
}

function selectSchedule(el, offset) {
    selectedScheduleOffset = offset;
    document.querySelectorAll('.schedule-option').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('scheduleConfirmBtn').disabled = false;
    document.getElementById('scheduleConfirmBtn').style.opacity = '1';
}

function confirmSchedule() {
    if (!selectedScheduleOffset) return;
    const text = document.getElementById('msgInput').value.trim();
    if (!text) { alert('Message is empty'); return; }
    const sendAt = Date.now() + selectedScheduleOffset;
    ChatsStorage.addScheduledMessage(contactId, text, sendAt);
    document.getElementById('msgInput').value = '';
    handleInputChange();
    closeModal('scheduleModal');
    renderMessages();
    const when = new Date(sendAt).toLocaleString();
    alert('Message scheduled for:\n' + when);
}

function showPendingMessages() {
    const pending = ChatsStorage.getScheduledForContact(contactId);
    const list = document.getElementById('pendingList');
    if (pending.length === 0) {
        list.innerHTML = '<p style="color:#6666aa;font-size:13px;text-align:center;padding:20px;">No pending messages</p>';
    } else {
        list.innerHTML = pending.sort((a, b) => a.sendAt - b.sendAt).map(m => {
            const when = new Date(m.sendAt);
            const timeStr = when.toLocaleString([], { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
            return `<div class="scheduled-item">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#ffaa00;flex-shrink:0;"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <div class="scheduled-item-info">
                    <div class="scheduled-item-text">${m.text}</div>
                    <div class="scheduled-item-time">${timeStr}</div>
                </div>
                <button class="scheduled-item-cancel" onclick="cancelScheduled(${m.id})">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>

// ===== IN-CHAT SEARCH =====
function toggleChatSearch() {
    const bar = document.getElementById('chatSearchBar');
    bar.classList.toggle('show');
    if (bar.classList.contains('show')) {
        setTimeout(() => document.getElementById('chatSearchInput').focus(), 100);
    } else {
        closeChatSearch();
    }
}

function closeChatSearch() {
    document.getElementById('chatSearchBar').classList.remove('show');
    document.getElementById('chatSearchInput').value = '';
    document.getElementById('searchCount').textContent = '0/0';
    searchMatches = [];
    currentMatchIndex = 0;
    document.querySelectorAll('.msg').forEach(el => {
        el.classList.remove('search-hidden', 'search-active-match');
    });
    document.querySelectorAll('.search-highlight').forEach(h => {
        const parent = h.parentNode;
        parent.replaceChild(document.createTextNode(h.textContent), h);
        parent.normalize();
    });
}

function performChatSearch() {
    const query = document.getElementById('chatSearchInput').value.trim();
    const messages = ChatsStorage.getMessages(contactId);
    document.querySelectorAll('.msg').forEach(el => {
        el.classList.remove('search-hidden', 'search-active-match');
    });
    if (!query) {
        document.getElementById('searchCount').textContent = '0/0';
        searchMatches = [];
        currentMatchIndex = 0;
        return;
    }
    const lowerQuery = query.toLowerCase();
    searchMatches = [];
    messages.forEach(m => {
        if (m.text && m.text.toLowerCase().includes(lowerQuery)) searchMatches.push(m.id);
    });
    document.querySelectorAll('.msg').forEach(el => {
        const msgId = parseInt(el.dataset.msgId);
        if (searchMatches.includes(msgId)) {
            el.classList.remove('search-hidden');
        } else {
            el.classList.add('search-hidden');
        }
    });
    currentMatchIndex = 0;
    updateSearchCount();
    scrollToCurrentMatch();
}

function updateSearchCount() {
    const count = document.getElementById('searchCount');
    if (searchMatches.length === 0) count.textContent = '0/0';
    else count.textContent = (currentMatchIndex + 1) + '/' + searchMatches.length;
}

function nextSearchMatch() {
    if (searchMatches.length === 0) return;
    currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
    updateSearchCount();
    scrollToCurrentMatch();
}

function prevSearchMatch() {
    if (searchMatches.length === 0) return;
    currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
    updateSearchCount();
    scrollToCurrentMatch();
}

function scrollToCurrentMatch() {
    if (searchMatches.length === 0) return;
    const msgId = searchMatches[currentMatchIndex];
    const el = document.querySelector(`.msg[data-msg-id="${msgId}"]`);
    if (!el) return;
    document.querySelectorAll('.msg').forEach(m => m.classList.remove('search-active-match'));
    el.classList.add('search-active-match');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ===== VOICE WAVEFORM =====
function generateWaveformBars(seed, count) {
    const bars = [];
    let random = seed;
    for (let i = 0; i < count; i++) {
        random = (random * 9301 + 49297) % 233280;
        const rand = random / 233280;
        const height = 30 + Math.floor(rand * 65);
        bars.push(height);
    }
    return bars;
}

function toggleVoicePlay(msgId) {
    const audio = document.getElementById('audio_' + msgId);
    const icon = document.getElementById('playIcon_' + msgId);
    if (!audio) return;
    document.querySelectorAll('audio').forEach(a => {
        if (a.id !== 'audio_' + msgId && !a.paused) {
            a.pause();
            const otherId = a.id.replace('audio_', '');
            const otherIcon = document.getElementById('playIcon_' + otherId);
            if (otherIcon) otherIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    });
    if (audio.paused) {
        audio.play();
        icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        if (audioSpeeds[msgId]) audio.playbackRate = audioSpeeds[msgId];
    } else {
        audio.pause();
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
}

function updateVoiceProgress(msgId) {
    const audio = document.getElementById('audio_' + msgId);
    const waveform = document.getElementById('waveform_' + msgId);
    const timeEl = document.getElementById('time_' + msgId);
    if (!audio || !waveform) return;
    const progress = audio.currentTime / audio.duration;
    const bars = waveform.querySelectorAll('.bar');
    const playedCount = Math.floor(progress * bars.length);
    bars.forEach((bar, i) => bar.classList.toggle('played', i < playedCount));
    if (timeEl) {
        const cur = Math.floor(audio.currentTime);
        const total = Math.floor(audio.duration) || 0;
        timeEl.textContent = `${cur}:${(total - cur).toString().padStart(2, '0')}`;
    }
}

function seekVoice(event, msgId) {
    const audio = document.getElementById('audio_' + msgId);
    const waveform = document.getElementById('waveform_' + msgId);
    if (!audio || !waveform || !audio.duration) return;
    const rect = waveform.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const percent = x / rect.width;
    audio.currentTime = percent * audio.duration;
    updateVoiceProgress(msgId);
}

function resetVoicePlayer(msgId) {
    const audio = document.getElementById('audio_' + msgId);
    const icon = document.getElementById('playIcon_' + msgId);
    const timeEl = document.getElementById('time_' + msgId);
    const waveform = document.getElementById('waveform_' + msgId);
    if (!audio) return;
    audio.currentTime = 0;
    if (icon) icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    if (waveform) waveform.querySelectorAll('.bar').forEach(bar => bar.classList.remove('played'));
    if (timeEl) {
        const dur = Math.floor(audio.duration) || 0;
        timeEl.textContent = '0:' + dur.toString().padStart(2, '0');
    }
}

function changeVoiceSpeed(msgId) {
    const audio = document.getElementById('audio_' + msgId);
    const speedEl = document.getElementById('speed_' + msgId);
    if (!audio || !speedEl) return;
    const speeds = [1, 1.5, 2];
    let current = audioSpeeds[msgId] || 1;
    let idx = speeds.indexOf(current);
    idx = (idx + 1) % speeds.length;
    const newSpeed = speeds[idx];
    audioSpeeds[msgId] = newSpeed;
    audio.playbackRate = newSpeed;
    speedEl.textContent = newSpeed + 'x';
}

function addReaction(emoji, msgId = null) {
    const targetId = msgId || reactionTargetMsgId;

function formatText(text) {
    if (!text) return '';
    let html = text;
    html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    html = html.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    html = html.replace(/_([^_\n]+)_/g, '<i>$1</i>');
    html = html.replace(/~([^~\n]+)~/g, '<s>$1</s>');
    html = html.replace(/```([^`]+)```/g, '<code>$1</code>');
    html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
    html = html.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
    html = html.replace(/\n/g, '<br>');
    return html;
}

    if (idx >= 0) forwardSelected.splice(idx, 1);
    else forwardSelected.push(id);
    const check = document.getElementById('fcheck_' + id);
    const item = check.parentElement;
    if (forwardSelected.includes(id)) {
        check.classList.add('checked');
        item.classList.add('selected');
    } else {
        check.classList.remove('checked');
        item.classList.remove('selected');
    }
    updateForwardBtn();

function forwardMessage() {
    if (forwardSelected.length === 0) return;
    const msgs = ChatsStorage.getMessages(contactId);
    const originalMsg = msgs.find(m => m.id === forwardMsgId);
    if (!originalMsg) return;
    forwardSelected.forEach(targetId => {
        const targetMsgs = ChatsStorage.getMessages(targetId);
        const now = new Date();
        const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        const newMsg = {
            id: Date.now() + Math.floor(Math.random() * 1000),
            text: originalMsg.text,
            sent: true,
            time: time,
            sender: 'Me',
            type: originalMsg.type,
            extra: originalMsg.extra,
            read: true,
            starred: false,
            forwarded: true,
            date: now.toISOString()
        };
        targetMsgs.push(newMsg);
        ChatsStorage.saveMessages(targetId, targetMsgs);
    });
    closeModal('forwardModal');
    alert('Forwarded to ' + forwardSelected.length + ' contact' + (forwardSelected.length > 1 ? 's' : ''));
}

}

function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('show');
    if (modal && modal.parentNode && (id === 'msgMenuModal' || id === 'editMsgModal' || id === 'forwardModal' || id === 'msgInfoModal')) modal.remove();
}

document.addEventListener('click', (e) => {
    const attachMenu = document.getElementById('attachMenu');
    const emojiPicker = document.getElementById('emojiPicker');
    const picker = document.getElementById('reactionPicker');
    if (attachMenu && !e.target.closest('.chat-input-bar') && !e.target.closest('.attach-menu')) attachMenu.classList.remove('show');
    if (emojiPicker && !e.target.closest('.chat-input-bar') && !e.target.closest('.emoji-picker')) emojiPicker.classList.remove('show');
    if (picker && !e.target.closest('.reaction-picker') && !e.target.closest('.modal')) picker.classList.remove('show');
});
</script>
</body>
</html>
