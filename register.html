<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8800ff">
<title>Register - MsGX</title>
<link rel="stylesheet" href="css/style-v2.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="#8800ff" width="80" height="80"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
    </div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join MsGX today</p>

    <div class="auth-card">
        <h2>Sign Up</h2>
        <p class="auth-error" id="errorMsg" style="display:none;"></p>
        <div class="auth-input-group">
            <svg viewBox="0 0 24 24" class="auth-input-icon"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <input type="text" id="regUsername" placeholder="Username" autocomplete="username">
        </div>
        <div class="auth-input-group">
            <svg viewBox="0 0 24 24" class="auth-input-icon"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
        </div>
        <div class="auth-input-group">
            <svg viewBox="0 0 24 24" class="auth-input-icon"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password">
        </div>
        <div class="auth-input-group">
            <svg viewBox="0 0 24 24" class="auth-input-icon"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" id="regPassword2" placeholder="Confirm Password" autocomplete="new-password">
        </div>
        <button class="auth-btn" onclick="handleRegister()">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Create Account
        </button>
        <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
</div>

<script src="js/chats.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadGlobalWallpaper();
    if (ChatsStorage.isLoggedIn()) window.location.href = 'index.html';
});

function handleRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;
    const errorMsg = document.getElementById('errorMsg');
    if (!username || !email || !password || !password2) { errorMsg.textContent = 'Please fill all fields'; errorMsg.style.display = 'block'; return; }
    if (password.length < 4) { errorMsg.textContent = 'Password must be at least 4 characters'; errorMsg.style.display = 'block'; return; }
    if (password !== password2) { errorMsg.textContent = 'Passwords do not match'; errorMsg.style.display = 'block'; return; }
    const result = ChatsStorage.registerUser(username, email, password);
    if (result.success) { alert('Account created! Please login.'); window.location.href = 'login.html'; }
    else { errorMsg.textContent = result.message; errorMsg.style.display = 'block'; }
}
</script>
</body>
</html>
