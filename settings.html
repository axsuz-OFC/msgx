        <div class="profile-name" id="profileName">User</div>
        <div class="profile-phone" id="profileEmail">user@msgx.com</div>

            <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#8800ff;"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>

                Video
            </button>
