<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <h1>MsGX</h1>
    <div class="app-bar-actions">
        <button onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
    </div>
</header>

<div class="tabs">
    <button class="tab" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chats</button>
    <button class="tab" onclick="window.location.href='status.html'"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>Status</button>
    <button class="tab" onclick="window.location.href='calls.html'"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>Calls</button>
</div>

<main class="container">
    <div class="profile-card">
        <div class="profile-avatar-big" id="avatarBig">U</div>
        <div class="profile-name" id="profileName">User</div>
        <div class="profile-phone" id="profileEmail">user@msgx.com</div>
    </div>

    <div class="settings-item">
        <div class="settings-item-title">Wallpaper</div>
        <div class="settings-item-sub" id="wallpaperInfo">Change chat background</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
            <button onclick="changeWallpaperImage()" class="settings-btn" style="flex:1;">Image</button>
            <button onclick="changeWallpaperVideo()" class="settings-btn" style="flex:1;">Video</button>
            <button onclick="resetWallpaper()" class="settings-btn" style="flex:1;">Reset</button>
        </div>
    </div>

    <div class="settings-item">
        <div class="settings-item-title">Account</div>
        <div class="settings-item-sub" id="accountInfo">Manage your account</div>
        <button onclick="logout()" class="settings-btn danger" style="margin-top:10px;">Logout</button>
    </div>
</main>

<input type="file" id="wallpaperImageInput" accept="image/*" style="display:none;">
<input type="file" id="wallpaperVideoInput" accept="video/*" style="display:none;">

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadGlobalWallpaper();
    renderBottomNav();
    const user = ChatsStorage.getCurrentUser();
    if (user) {
        document.getElementById('avatarBig').textContent = user.username.charAt(0).toUpperCase();
        document.getElementById('profileName').textContent = user.username;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('accountInfo').textContent = user.email;
    }
    const wp = localStorage.getItem('msgx_wallpaper');
    document.getElementById('wallpaperInfo').textContent = wp ? 'Wallpaper set' : 'No wallpaper set';
});

document.getElementById('wallpaperImageInput').addEventListener('change', (e) => handleWallpaper(e, 'image'));
document.getElementById('wallpaperVideoInput').addEventListener('change', (e) => handleWallpaper(e, 'video'));

function handleWallpaper(e, type) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        ChatsStorage.saveWallpaper(ev.target.result, type);
        loadGlobalWallpaper();
        document.getElementById('wallpaperInfo').textContent = 'Wallpaper set';
        alert('Wallpaper updated!');
    };
    reader.readAsDataURL(file);
}
function changeWallpaperImage() { document.getElementById('wallpaperImageInput').click(); }
function changeWallpaperVideo() { document.getElementById('wallpaperVideoInput').click(); }
function resetWallpaper() { ChatsStorage.resetWallpaper(); document.body.style.backgroundImage = ''; const v = document.querySelector('.global-video-bg'); if (v) v.remove(); document.getElementById('wallpaperInfo').textContent = 'No wallpaper set'; alert('Wallpaper reset!'); }
function logout() { if (confirm('Logout?')) { ChatsStorage.logoutUser(); window.location.href = 'login.html'; } }
</script>
</body>
</html>
