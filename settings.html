<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
let selectedPhoto = null;

document.addEventListener('DOMContentLoaded', () => {
    loadGlobalWallpaper();
    renderBottomNav();
    renderProfile();

    const wp = localStorage.getItem('msgx_wallpaper');
    document.getElementById('wallpaperInfo').textContent = wp ? 'Wallpaper set' : 'Change chat background';
});

function renderProfile() {
    const user = ChatsStorage.getCurrentUser();
    if (user) {
        document.getElementById('avatarBig').textContent = user.name ? user.name.charAt(0).toUpperCase() : user.username.charAt(0).toUpperCase();
        document.getElementById('profileName').textContent = user.name || user.username;
        document.getElementById('profileUsername').textContent = '@' + user.username;
    }
    const photo = localStorage.getItem('msgx_profile_photo');
    if (photo) {
        const av = document.getElementById('avatarBig');
        av.style.backgroundImage = `url(${photo})`;
        av.style.backgroundSize = 'cover';
        av.style.backgroundPosition = 'center';
        av.textContent = '';
    }
}

function openEditProfile() {
    const user = ChatsStorage.getCurrentUser();
    if (!user) return;
    document.getElementById('editName').value = user.name || '';
    document.getElementById('editUsername').value = user.username || '';
    document.getElementById('editEmail').value = user.email || '';
    document.getElementById('editPhone').value = user.phone || '';
    const photo = localStorage.getItem('msgx_profile_photo');
    const av = document.getElementById('editAvatar');
    if (photo) {
        av.style.backgroundImage = `url(${photo})`;
        av.style.backgroundSize = 'cover';
        av.style.backgroundPosition = 'center';
        av.textContent = '';
    } else {
        av.textContent = user.username.charAt(0).toUpperCase();
    }
    document.getElementById('editProfileModal').classList.add('show');
}

document.getElementById('profilePhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        selectedPhoto = ev.target.result;
        const av = document.getElementById('editAvatar');
        av.style.backgroundImage = `url(${selectedPhoto})`;
        av.style.backgroundSize = 'cover';
        av.style.backgroundPosition = 'center';
        av.textContent = '';
    };
    reader.readAsDataURL(file);
});

function saveProfile() {
    const name = document.getElementById('editName').value.trim();
    const username = document.getElementById('editUsername').value.trim();
    const email = document.getElementById('editEmail').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    if (!name || !username || !email) { alert('Name, username and email are required'); return; }

    const user = ChatsStorage.getCurrentUser();
    user.name = name;
    user.username = username;
    user.email = email;
    user.phone = phone;
    localStorage.setItem('msgx_current_user', JSON.stringify(user));

    const users = ChatsStorage.getUsers();
    const idx = users.findIndex(u => u.id === user.id);
    if (idx >= 0) { users[idx] = user; ChatsStorage.saveUsers(users); }

    if (selectedPhoto) localStorage.setItem('msgx_profile_photo', selectedPhoto);

    closeModal('editProfileModal');
    renderProfile();
    alert('Profile updated!');
}

function changeWallpaper() { document.getElementById('wallpaperImageInput').click(); }

document.getElementById('wallpaperImageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        ChatsStorage.saveWallpaper(ev.target.result, 'image');
        loadGlobalWallpaper();
        document.getElementById('wallpaperInfo').textContent = 'Wallpaper set';
        alert('Wallpaper updated!');
    };
    reader.readAsDataURL(file);
});

function openAccountSettings() { window.location.href = 'account.html'; }
function openPrivacySettings() { window.location.href = 'privacy.html'; }
function openNotifications() { window.location.href = 'notifications.html'; }
function openStorage() { window.location.href = 'storage.html'; }
function openHelp() { window.location.href = 'help.html'; }

function logout() {
    if (confirm('Logout?')) {
        ChatsStorage.logoutUser();
        window.location.href = 'login.html';
    }
}
function closeModal(id) { const m = document.getElementById(id); if (m) m.classList.remove('show'); }
</script>
