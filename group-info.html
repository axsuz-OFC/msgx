<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Info - MsGX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
    <a href="#" onclick="goBack(); return false;" style="text-decoration:none;display:flex;align-items:center;">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#b0b0d0;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <h1>Group Info</h1>
    <div class="app-bar-actions"></div>
</header>

<main class="container" id="groupContent"></main>

<div class="modal" id="addMemberModal">
    <div class="modal-content">
        <h2>Add Members</h2>
        <div id="availableContactsList" style="max-height:350px;overflow-y:auto;margin-bottom:15px;"></div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('addMemberModal')">Cancel</button>
            <button class="btn-save" onclick="addSelectedMembers()" id="addMemberBtn" disabled style="opacity:0.5;">Add</button>
        </div>
    </div>
</div>

<div class="modal" id="editGroupNameModal">
    <div class="modal-content">
        <h2>Edit Group Name</h2>
        <input type="text" id="editGroupNameInput" placeholder="Enter group name">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal('editGroupNameModal')">Cancel</button>
            <button class="btn-save" onclick="saveGroupName()">Save</button>
        </div>
    </div>
</div>

<input type="file" id="groupPhotoInput" accept="image/*" style="display:none;">

<script src="js/chats.js"></script>
<script>
let groupId = null;
let group = null;
let selectedMembers = [];

document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    loadGlobalWallpaper();
    const params = new URLSearchParams(window.location.search);
    groupId = params.get('id');
    if (!groupId) { window.location.href = 'index.html'; return; }
    group = ChatsStorage.getContact(groupId);
    if (!group || !group.isGroup) { window.location.href = 'index.html'; return; }
    renderGroupInfo();
});

function goBack() {
    window.location.href = 'chat.html?id=' + groupId;
}

function renderGroupInfo() {
    const groupPhoto = localStorage.getItem('msgx_group_photo_' + groupId);
    const members = group.members || [];
    const memberContacts = members.map(id => ChatsStorage.getContact(id)).filter(Boolean);

    const avatarContent = groupPhoto ? '' : group.name.charAt(0).toUpperCase();
    const avatarStyle = groupPhoto 
        ? `background-image:url(${groupPhoto});background-size:cover;background-position:center;`
        : '';

    document.getElementById('groupContent').innerHTML = `
        <div class="group-header">
            <div class="group-avatar-big" style="${avatarStyle}" onclick="document.getElementById('groupPhotoInput').click()">
                ${avatarContent}
                <div class="camera-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 15.2c1.77 0 3.2-1.43 3.2-3.2s-1.43-3.2-3.2-3.2-3.2 1.43-3.2 3.2 1.43 3.2 3.2 3.2zM9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </div>
            </div>
            <div class="group-name-big" onclick="editGroupName()" style="cursor:pointer;">${group.name} <span style="font-size:14px;color:#8800ff;">✎</span></div>
            <div class="group-members-count">${members.length} member${members.length !== 1 ? 's' : ''}</div>
        </div>

        <div class="settings-item">
            <div class="settings-item-title">Members (${memberContacts.length})</div>
            <div class="member-list">
                ${memberContacts.map(m => {
                    const color = getAvatarColor(m.name);
                    return `<div class="member-item">
                        <div class="member-avatar" style="background:${color};">${m.name.charAt(0).toUpperCase()}</div>
                        <div class="member-info">
                            <div class="member-name">${m.name}${m.id == groupId ? '<span class="member-admin-badge">You</span>' : ''}</div>
                            <div class="member-sub">${m.phone || 'No phone'}</div>
                        </div>
                        ${m.id != groupId ? `
                            <button class="member-remove-btn" onclick="removeMember(${m.id})">
                                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                            </button>
                        ` : ''}
                    </div>`;
                }).join('')}

                <div class="add-member-row" onclick="openAddMember()">
                    <div class="add-icon">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </div>
                    <div class="add-text">Add Member</div>
                </div>
            </div>
        </div>

        <div class="settings-list">
            <div class="settings-row" onclick="openAddMember()">
                <div class="settings-row-icon" style="background:rgba(0,255,136,0.15);">
                    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#00ff88;"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="settings-row-text">
                    <div class="settings-row-title">Add Members</div>
                    <div class="settings-row-sub">Add contacts to this group</div>
                </div>
                <div class="settings-row-arrow"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></div>
            </div>

            <div class="settings-row" onclick="editGroupName()">
                <div class="settings-row-icon" style="background:rgba(136,0,255,0.15);">
                    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#8800ff;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </div>
                <div class="settings-row-text">
                    <div class="settings-row-title">Edit Group Name</div>
                    <div class="settings-row-sub">Change the group name</div>
                </div>
                <div class="settings-row-arrow"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></div>
            </div>

            <div class="settings-row" onclick="document.getElementById('groupPhotoInput').click()">
                <div class="settings-row-icon" style="background:rgba(0,170,255,0.15);">
                    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#00aaff;"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </div>
                <div class="settings-row-text">
                    <div class="settings-row-title">Change Group Photo</div>
                    <div class="settings-row-sub">Upload a new group icon</div>
                </div>
                <div class="settings-row-arrow"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></div>
            </div>
        </div>

        <button onclick="leaveGroup()" class="settings-btn danger" style="margin-top:10px;">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#ff3366;margin-right:8px;"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            Leave Group
        </button>
    `;
}

function getAvatarColor(name) {
    const colors = [
        'linear-gradient(135deg, #8800ff, #00aaff)',
        'linear-gradient(135deg, #ff0080, #8800ff)',
        'linear-gradient(135deg, #00aaff, #00ff88)',
        'linear-gradient(135deg, #ff6600, #ff0080)',
        'linear-gradient(135deg, #9c27b0, #00aaff)'
    ];
    return colors[name.charCodeAt(0) % colors.length];
}

function editGroupName() {
    document.getElementById('editGroupNameInput').value = group.name;
    document.getElementById('editGroupNameModal').classList.add('show');
}

function saveGroupName() {
    const newName = document.getElementById('editGroupNameInput').value.trim();
    if (!newName) { alert('Please enter a name'); return; }
    const contacts = ChatsStorage.getContacts();
    const idx = contacts.findIndex(c => c.id == groupId);
    if (idx >= 0) {
        contacts[idx].name = newName;
        ChatsStorage.saveContacts(contacts);
    }
    group = ChatsStorage.getContact(groupId);
    closeModal('editGroupNameModal');
    renderGroupInfo();
    alert('Group name updated!');
}

function removeMember(memberId) {
    if (!confirm('Remove this member from the group?')) return;
    const contacts = ChatsStorage.getContacts();
    const idx = contacts.findIndex(c => c.id == groupId);
    if (idx >= 0) {
        contacts[idx].members = (contacts[idx].members || []).filter(id => id != memberId);
        ChatsStorage.saveContacts(contacts);
    }
    group = ChatsStorage.getContact(groupId);
    renderGroupInfo();
    alert('Member removed');
}

function openAddMember() {
    selectedMembers = [];
    const allContacts = ChatsStorage.getContacts().filter(c => !c.isGroup);
    const currentMembers = group.members || [];
    const available = allContacts.filter(c => !currentMembers.includes(String(c.id)) && !currentMembers.includes(c.id));

    const list = document.getElementById('availableContactsList');
    if (available.length === 0) {
        list.innerHTML = '<p style="color:#6666aa;font-size:13px;text-align:center;padding:20px;">No available contacts to add</p>';
    } else {
        list.innerHTML = available.map(c => {
            const color = getAvatarColor(c.name);
            return `<div class="select-member-item" data-id="${c.id}" onclick="toggleMember(${c.id})">
                <div class="select-checkbox" id="scheck_${c.id}">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
                <div class="member-avatar" style="background:${color};">${c.name.charAt(0).toUpperCase()}</div>
                <div class="member-info">
                    <div class="member-name">${c.name}</div>
                    <div class="member-sub">${c.phone || 'No phone'}</div>
                </div>
            </div>`;
        }).join('');
    }
    updateAddBtn();
    document.getElementById('addMemberModal').classList.add('show');
}

function toggleMember(id) {
    const idx = selectedMembers.indexOf(id);
    if (idx >= 0) selectedMembers.splice(idx, 1);
    else selectedMembers.push(id);

    const check = document.getElementById('scheck_' + id);
    const item = check.parentElement;
    if (selectedMembers.includes(id)) {
        check.classList.add('checked');
        item.classList.add('selected');
    } else {
        check.classList.remove('checked');
        item.classList.remove('selected');
    }
    updateAddBtn();
}

function updateAddBtn() {
    const btn = document.getElementById('addMemberBtn');
    if (selectedMembers.length > 0) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.textContent = 'Add (' + selectedMembers.length + ')';
    } else {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = 'Add';
    }
}

function addSelectedMembers() {
    if (selectedMembers.length === 0) return;
    const contacts = ChatsStorage.getContacts();
    const idx = contacts.findIndex(c => c.id == groupId);
    if (idx >= 0) {
        const currentMembers = contacts[idx].members || [];
        selectedMembers.forEach(id => {
            if (!currentMembers.includes(String(id))) {
                currentMembers.push(String(id));
            }
        });
        contacts[idx].members = currentMembers;
        ChatsStorage.saveContacts(contacts);
    }
    group = ChatsStorage.getContact(groupId);
    closeModal('addMemberModal');
    renderGroupInfo();
    alert(selectedMembers.length + ' member(s) added');
}

function leaveGroup() {
    if (!confirm('Leave this group? You will no longer see this chat.')) return;
    ChatsStorage.deleteContact(groupId);
    alert('You left the group');
    window.location.href = 'index.html';
}

document.getElementById('groupPhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        localStorage.setItem('msgx_group_photo_' + groupId, ev.target.result);
        renderGroupInfo();
        alert('Group photo updated!');
    };
    reader.readAsDataURL(file);
});

function closeModal(id) {
    const m = document.getElementById(id);
    if (m) m.classList.remove('show');
}
</script>
</body>
</html>
